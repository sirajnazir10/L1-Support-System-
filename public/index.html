  // ============================================================
  //  QUEUE RENDERING (with search + status/priority filtering)
  // ============================================================
  var queueList, ticketDetailEl;

  function statusClass(status){
    return { "New":"new", "In Progress":"progress", "Escalated":"escalated", "Resolved":"resolved" }[status] || "new";
  }
  function priorityClass(p){ return p === "High" ? "high" : (p === "Medium" ? "medium" : "low"); }

  function filteredTickets(){
    var q = queueFilter.query.trim().toLowerCase();
    return tickets.filter(function(t){
      if(queueFilter.status !== 'all' && t.status !== queueFilter.status) return false;
      if(queueFilter.priority !== 'all' && t.priority !== queueFilter.priority) return false;
      if(q && (t.subject.toLowerCase().indexOf(q) === -1 && t.customer.toLowerCase().indexOf(q) === -1 && String(t.id).toLowerCase().indexOf(q) === -1)) return false;
      return true;
    });
  }

  function renderQueue(){
    if(!queueList) return;
    var openCount = tickets.filter(function(t){ return t.status !== 'Resolved'; }).length;
    navQueueBadge.textContent = String(openCount);
    var list = filteredTickets().slice().reverse();
    if(!list.length){
      queueList.innerHTML = '<div class="queue-empty">No tickets match your search/filters.</div>';
    } else {
      queueList.innerHTML = list.map(function(t){
        return '<button type="button" class="queue-item' + (t.id === activeTicketId ? ' active' : '') + '" data-id="' + escapeHtml(t.id) + '">' +
          '<div class="qtop"><span class="qsubj">' + escapeHtml(t.subject) + '</span></div>' +
          '<div class="qmeta"><span class="pr-dot ' + priorityClass(t.priority) + '"></span>' + escapeHtml(t.id) + ' · ' + escapeHtml(t.customer) + '</div>' +
          '<div class="qmeta"><span class="badge ' + statusClass(t.status) + '">' + t.status + '</span><span>' + t.createdAt + '</span></div>' +
        '</button>';
      }).join('');
      Array.prototype.forEach.call(queueList.querySelectorAll('.queue-item'), function(btn){
        btn.addEventListener('click', function(){
          activeTicketId = btn.getAttribute('data-id');
          renderQueue();
          renderTicketDetail();
          document.getElementById('mainContent').scrollTop = 0;
        });
      });
    }
    if(!activeTicketId && tickets.length){ activeTicketId = tickets[tickets.length-1].id; }
    renderTicketDetail();
  }

  function syncLiveTicketIdLabel(t){
    var el = document.getElementById('custTicketId');
    if(el && liveTicket && t.id !== undefined && liveTicket === t) el.textContent = t.id;
  }

  // ============================================================
  //  TICKET DETAIL — Customer Query / AI Analysis / Knowledge
  //  Sources / Suggested Response, each an expandable section.
  // ============================================================
  var sectionCollapsed = { query:false, analysis:false, reasoning:true, sources:false, response:false };

  function textToHtml(t){ return escapeHtml(t).replace(/\n/g, '<br/>'); }
  function polishText(text){
    var t = text.replace(/\r\n/g, '\n').replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
    t = t.replace(/(^|[.!?]\s+)([a-z])/g, function(m,p1,p2){ return p1 + p2.toUpperCase(); });
    if(!/^(hi|hello|dear|hey)\b/i.test(t)) t = "Hi,\n\n" + t;
    if(!/(best regards|best,|regards,|thank you,|thanks,|mr nexis)\s*$/i.test(t)) t = t + "\n\nBest regards,\nMR Nexis";
    return t;
  }
  function simplifyToHtml(text){
    var lines = text.replace(/\r\n/g,'\n').split(/\n+/).map(function(s){ return s.trim(); }).filter(Boolean);
    var sentences = [];
    lines.forEach(function(line){
      if(/^(hi|hello|dear|hey|best|regards|thanks|thank you)\b/i.test(line) || /mr nexis/i.test(line)) return;
      line.split(/(?<=[.!?])\s+/).forEach(function(s){ s = s.trim(); if(s.length > 3) sentences.push(s); });
    });
    if(!sentences.length) return textToHtml(polishText(text));
    var html = '<p>' + escapeHtml(sentences[0]) + '</p>';
    if(sentences.length > 1) html += '<ul>' + sentences.slice(1).map(function(s){ return '<li>' + escapeHtml(s) + '</li>'; }).join('') + '</ul>';
    html += '<p>Best regards,<br/>MR Nexis</p>';
    return html;
  }

  function getActiveTicket(){ return tickets.filter(function(t){ return t.id === activeTicketId; })[0]; }

  function renderTicketDetail(){
    if(!ticketDetailEl) return;
    var t = getActiveTicket();
    if(!t){
      ticketDetailEl.innerHTML = '<div class="detail-card"><div class="detail-empty">' + ic('inbox') +
        '<div>Select a ticket from the queue to see the Customer Query, AI Analysis, Knowledge Sources, and Suggested Response.</div></div></div>';
      return;
    }
    var confidencePct = Math.round((t.confidence||0)*100);

    var attachmentsHtml = '';
    var allAttachments = [];
    t.messages.forEach(function(m){ m.parts.forEach(function(p){ if(p.type==='image'||p.type==='file') allAttachments.push(p); }); });
    if(allAttachments.length){
      attachmentsHtml = '<div class="attach-row">' + allAttachments.map(function(p){
        return '<span class="file-chip">' + ic(p.type==='image'?'image':'file') + escapeHtml(p.name) + '</span>';
      }).join('') + '</div>';
    }

    var transcriptHtml = t.messages.map(function(m){
      var body = m.parts.map(function(p){
        if(p.type === 'text') return escapeHtml(p.value);

        return '';
      }).join('');
      return '<div class="msg ' + (m.role==='user'?'user':'bot') + '"><div class="msg-label">' + (m.role==='user'?escapeHtml(t.customer):'MR Nexis Assistant') + '</div><div class="bubble">' + body + '</div></div>';
    }).join('') || '<div class="empty-inline">No messages yet on this ticket.</div>';

    var followupHtml = t.followups.length ? (
      '<div class="followup-card"><div class="ttl">' + ic('alert') + 'Missing information detected</div><ul>' +
      t.followups.map(function(q){ return '<li>' + escapeHtml(q) + '</li>'; }).join('') + '</ul></div>'
    ) : '';

    var escalationHtml = t.escalate
      ? ('<div class="escalation-block"><div class="ttl">' + ic('flag') + 'Recommended: Escalate to L2/L3 · R&amp;D</div>' +
         '<div style="font-size:12.3px;">' + escapeHtml(t.escalateReason || '') + '</div>' +
         '<pre>' + escapeHtml(buildEscalationTicket(t)) + '</pre></div>')
      : '';

    var sourcesHtml = !t.matches.length
      ? '<div class="empty-inline">No documentation section matched closely enough to cite.</div>'
      : t.matches.slice(0,6).map(function(m,i){
          return '<div class="match-card" data-idx="' + i + '"><div class="mtitle">' + escapeHtml(m.entry.title) + '</div>' +
            '<div class="msrc">' + escapeHtml(m.entry.sourceDoc) + ' · p.' + m.entry.page + '</div>' +

      return '<span class="file-chip">' + ic(a.isImage?'image':'file') + escapeHtml(a.name) + ' <button type="button" class="icon-btn" style="width:16px;height:16px;" data-remove-attach="' + i + '">' + ic('x') + '</button></span>';
    }).join('') + '</div>') : '';

    function sec(key, iconName, title, countLabel, bodyHtml){
      var collapsed = sectionCollapsed[key];
      return '<div class="detail-card expand-card' + (collapsed?' collapsed':'') + '" data-section="' + key + '">' +
        '<button type="button" class="expand-header">' + ic(iconName,'section-icon') +
          '<span class="etitle">' + title + '</span>' + (countLabel ? '<span class="ecount">' + countLabel + '</span>' : '') +
          ic('chevDown','chev') +
        '</button>' +
        '<div class="expand-body">' + bodyHtml + '</div>' +
      '</div>';
    }

    ticketDetailEl.innerHTML =
      '<div class="detail-card"><div class="detail-header">' +
        '<div><h2>' + escapeHtml(t.subject) + '</h2><div class="meta">' + escapeHtml(t.id) + ' · ' + escapeHtml(t.customer) + ' · opened ' + t.createdAt + '</div></div>' +
        '<span class="badge ' + statusClass(t.status) + '">' + t.status + '</span>' +
      '</div></div>' +

      sec('query','chat','Customer Query', t.messages.length + ' message' + (t.messages.length===1?'':'s'),
        '<div class="transcript-list">' + transcriptHtml + '</div>' + attachmentsHtml) +

      sec('analysis','sparkles','AI Analysis', confidencePct + '% confidence',
        '<div class="analysis-grid">' +
          '<div class="a-field"><span class="lbl">Category / Module</span><span class="val">' + escapeHtml(t.module) + '</span></div>' +
          '<div class="a-field"><span class="lbl">Priority</span><span class="val">' + t.priority + '</span></div>' +
          '<div class="a-field"><span class="lbl">Known issue?</span><span class="val">' + (t.matches.length ? 'Documented' : 'Not documented') + '</span></div>' +
          '<div class="a-field"><span class="lbl">Route</span><span class="val">' + (t.escalate ? 'Escalate' : 'MR Nexis resolvable') + '</span></div>' +
        '</div>' +
        '<div class="a-field" style="background:none;padding:0;"><span class="lbl">Match confidence</span></div>' +
        '<div class="meter-row"><div class="meter"><i style="width:' + confidencePct + '%"></i></div><span class="meter-num">' + confidencePct + '%</span></div>' +
        '<div class="investigate-note ' + (t.investigate ? 'needed' : 'clear') + '" style="margin-top:10px;">' +
          '<div><b>Further investigation required:</b> ' + (t.investigate ? 'YES' : 'NO') + '</div>' +
          (t.investigate && t.nextAction ? '<div>Still needed: ' + escapeHtml(t.nextAction) + '</div>' : '') +
        '</div>' +
        followupHtml + escalationHtml) +

      sec('reasoning','sparkles','Internal Reasoning (not shown to customer)',
        t.reasoning ? (t.reasoning.confidenceBand + ' confidence') : '',
        renderReasoningPanel(t)) +

      sec('sources','book','Knowledge Sources', t.matches.length ? (t.matches.length + ' match' + (t.matches.length===1?'':'es')) : '', sourcesHtml) +

      sec('response','docCheck','Suggested Response', '',
        '<div class="editor-toolbar">' +
          '<button class="tbtn" data-cmd="undo" title="Undo">' + ic('undo') + '</button>' +
          '<button class="tbtn" data-cmd="redo" title="Redo">' + ic('redo') + '</button>' +
          '<span class="tb-sep"></span>' +
          '<button class="tbtn" data-cmd="bold" title="Bold"><b>B</b></button>' +
          '<button class="tbtn" data-cmd="italic" title="Italic"><i>I</i></button>' +
          '<button class="tbtn" data-cmd="underline" title="Underline"><u>U</u></button>' +
          '<button class="tbtn" data-cmd="strikeThrough" title="Strikethrough"><s>S</s></button>' +
          '<span class="tb-sep"></span>' +

  function walkComposerNode(node, parts){
    if(node.nodeType === Node.TEXT_NODE){
      var t = node.textContent;
      if(t) parts.push({ type:'text', value:t });
    } else if(node.nodeType === Node.ELEMENT_NODE){
      if(node.tagName === 'IMG'){
        parts.push({ type:'image', src:node.src, name:node.dataset.name || 'screenshot.png', size:parseInt(node.dataset.size||'0',10) });
      } else if(node.tagName === 'BR'){
        parts.push({ type:'break' });
      } else if(node.dataset && node.dataset.file){
        parts.push({ type:'file', name:node.dataset.name || 'file', size:parseInt(node.dataset.size||'0',10) });
      } else {
        Array.prototype.forEach.call(node.childNodes, function(child){ walkComposerNode(child, parts); });
        if(node.tagName === 'DIV') parts.push({ type:'break' });
      }
    }
  }
  function extractComposerParts(){
    var parts = [];
    Array.prototype.forEach.call(composer.childNodes, function(n){ walkComposerNode(n, parts); });
    while(parts.length && parts[0].type === 'break') parts.shift();
    while(parts.length && parts[parts.length-1].type === 'break') parts.pop();
    return parts;
  }
  function partsToText(parts){

      else if(p.type === 'image'){ var img=document.createElement('img'); img.src=p.src; img.className='inline-img'; bubble.appendChild(img); }
      else if(p.type === 'file'){ var chip=document.createElement('span'); chip.className='file-chip'; chip.innerHTML=ic('file')+escapeHtml(p.name); bubble.appendChild(chip); }
    });
    wrap.appendChild(label); wrap.appendChild(bubble);

  }
  // Renders either a plain string (greetings) or a Section 6 structured reply:
  // Understanding / Answer / Next Step / Further Investigation Required.
  // Internal reasoning field names never appear here — those live in the agent console only.
  function addBotMessage(payload){
    var wrap = document.createElement('div');
    wrap.className = 'msg bot';
    var label = document.createElement('div'); label.className='msg-label'; label.textContent='Nexis';
    var bubble = document.createElement('div'); bubble.className='bubble';

    if(typeof payload === 'string'){
      bubble.textContent = payload;
      wrap.appendChild(label); wrap.appendChild(bubble);
      chatBody.appendChild(wrap); chatBody.scrollTop = chatBody.scrollHeight;
      return;
    }

    // Rendered as one flowing paragraph, not three separately-labeled blocks — a person
    // doesn't preface an answer with a bolded "Understanding:" header. The underlying fields
    // stay separate (composeNexisReply, the ticket transcript, and the agent console all still
    // use them individually) — this only changes how the customer-facing bubble displays them.
    var parts = [payload.understanding, payload.answer, payload.nextStep].filter(Boolean);
    // Normally these read as consecutive sentences of one paragraph (space-joined). But when a
    // part is itself a multi-line block (a bulleted list inside the answer), running the next
    // sentence straight onto its last line reads as if it were part of the list — so that join
    // gets its own blank line instead of a space.
    var paragraph = parts.reduce(function(acc, p, i){
      if(i === 0) return p;
      return acc + (parts[i - 1].indexOf('\n') !== -1 ? '\n\n' : ' ') + p;
    }, '');
    var html = paragraph ? '<div class="rsec">' + escapeHtml(paragraph).replace(/\n/g, '<br/>') + '</div>' : '';
    bubble.innerHTML = html;
    wrap.appendChild(label); wrap.appendChild(bubble);

    if(payload.citation){
      var cite = document.createElement('div'); cite.className = 'cite'; cite.textContent = payload.citation;
      wrap.appendChild(cite);
    }
    var note = document.createElement('div');
    note.className = 'investigate-note ' + (payload.investigate ? 'needed' : 'clear');
    var line1 = document.createElement('div');
    line1.innerHTML = '<b>Further investigation required:</b> ' + (payload.investigate ? 'YES' : 'NO');
    note.appendChild(line1);
    if(payload.investigate && payload.missingWhat){
      var line2 = document.createElement('div');
      line2.textContent = 'Still needed: ' + payload.missingWhat;
      note.appendChild(line2);
    }
    wrap.appendChild(note);
    chatBody.appendChild(wrap); chatBody.scrollTop = chatBody.scrollHeight;
  }
  function showTyping(){
    var t = document.createElement('div'); t.className='typing'; t.id='typingIndicator';
    t.innerHTML = '<span></span><span></span><span></span>';
    chatBody.appendChild(t); chatBody.scrollTop = chatBody.scrollHeight;
  }
  function hideTyping(){ var t=document.getElementById('typingIndicator'); if(t) t.remove(); }

  function trySend(){
    var parts = extractComposerParts();
    if(!parts.length) return;
    var text = partsToText(parts).trim();
    if(!text && !parts.some(function(p){return p.type==='image'||p.type==='file';})) return;

    addUserMessage(parts);
    composer.innerHTML = '';
    sendBtn.disabled = true;
    showTyping();

    var hasAttachment = parts.some(function(p){return p.type==='image'||p.type==='file';});
    var smalltalk = hasAttachment ? null : smallTalkReply(text);
    if(smalltalk){
      setTimeout(function(){
        hideTyping();
        addBotMessage(smalltalk);
        if(liveTicket){
          liveTicket.messages.push({ role:'user', parts: parts });
          liveTicket.messages.push({ role:'bot', parts:[{type:'text', value: smalltalk}] });
          persistTicketUpdate(liveTicket);
        }
        sendBtn.disabled = false;
        composer.focus();
      }, reduceMotion ? 150 : 500);
      return;
    }

    // Understand -> check latest knowledge -> analyze -> verify -> answer -> suggest further investigation.
    var minDelay = new Promise(function(resolve){ setTimeout(resolve, reduceMotion ? 150 : 900); });
    var refreshKb = apiGet('/api/kb').then(function(kb){ if(kb && kb.length) KB = kb; }).catch(function(){ /* keep last-known KB if refresh fails */ });

    Promise.all([minDelay, refreshKb]).then(function(){
      hideTyping();
      // Normalize -> retrieve -> reason -> validate -> answer. The reply is only allowed out
      // after Section 7 validation; an unvalidated draft becomes an honest "not enough
      // verified information" reply rather than a confident guess.
      var rawMatches = findMatches(text || 'attachment');
      var reply = composeNexisReply(text, rawMatches, {
        lastSourceDoc: liveTicket ? liveTicket.lastSourceDoc : null,
        lastTopicLabel: liveTicket ? liveTicket.lastTopicLabel : null,
        clarificationRounds: liveTicket ? (liveTicket.clarificationRounds || 0) : 0,
        attachments: describeAttachments(parts)
      });
      var matches = reply.usedMatches || [];
      var confidence = reply.reasoning.confidence;
      var esc = shouldEscalate(text, confidence, matches);
      var priority = priorityOf(text, confidence);
      var followups = missingInfoQuestions(text, matches);

      // Ticket fields (escalation, priority, confidence, investigate flag) always come from the
      // local deterministic engine above — never from the LLM draft — so escalation/routing
      // behavior can't vary based on phrasing. `displayReply` is the only thing that changes:
      // what's actually shown in the chat bubble and saved into the transcript.
      function finish(displayReply){
        if(!liveTicket){
          liveTicket = makeTicket({
            subject: text ? excerpt(text, 60) : 'Attachment received',
            customer: 'You (live chat)', status: 'New', priority: priority,
            module: moduleOf(matches), matches: matches, confidence: confidence,
            escalate: esc.escalate, escalateReason: esc.reason,
            investigate: reply.investigate, nextAction: reply.missingWhat,
            reasoning: reply.reasoning,
            draft: matches.length ? matches[0].entry.answer : "Thanks for the details — I don't have a confident match in the documentation yet, so I've flagged this for an agent to review personally.",
            followups: followups, messages: [], isLive: true
          });
          custTicketId.textContent = liveTicket.id;
          log('New live ticket <b>' + liveTicket.id + '</b> opened from Customer Portal.');
        } else {
          liveTicket.matches = matches; liveTicket.confidence = confidence;
          liveTicket.escalate = esc.escalate; liveTicket.escalateReason = esc.reason;
          liveTicket.investigate = reply.investigate; liveTicket.nextAction = reply.missingWhat;
          liveTicket.priority = priority; liveTicket.followups = followups;
          liveTicket.module = moduleOf(matches);
          liveTicket.reasoning = reply.reasoning;
          persistTicketUpdate(liveTicket);
        }
        // Section 4: at most one clarifying question per turn, and at most two rounds per ticket.
        if(reply.askedClarification) liveTicket.clarificationRounds = (liveTicket.clarificationRounds || 0) + 1;
        liveTicket.lastSourceDoc = reply.resolvedSourceDoc || liveTicket.lastSourceDoc || null;
        liveTicket.lastTopicLabel = reply.resolvedTopicLabel || liveTicket.lastTopicLabel || null;
        liveTicket.messages.push({ role:'user', parts: parts });
        custStatusBadge.className = 'badge ' + statusClass(liveTicket.status);
        custStatusBadge.textContent = liveTicket.status;

        addBotMessage(displayReply);
        var transcript = 'Understanding: ' + displayReply.understanding + '\n\nAnswer: ' + displayReply.answer +
          (displayReply.nextStep ? ('\n\nNext step: ' + displayReply.nextStep) : '') +
          '\n\nFurther investigation required: ' + (reply.investigate ? 'YES' : 'NO');
        liveTicket.messages.push({ role:'bot', parts:[{type:'text', value: transcript}] });

        if(matches.length){ liveTicket.draft = matches[0].entry.answer; liveTicket.originalDraft = matches[0].entry.answer; liveTicket.draftIsHtml = false; }
        renderQueue();

        sendBtn.disabled = false;
        composer.focus();
      }

      // LLM first, keyword fallback: the local engine above already did all retrieval,
      // validation, and honesty-gating (never guesses) — the LLM call only asks for a more
      // naturally-phrased draft of the SAME already-validated matches, and only replaces the
      // wording if it actually grounds itself in one of those matches and says it's confident.
      // Any missing key, network failure, or low-confidence response falls straight back to
      // the exact reply this app has always produced.
      if(nexisLlmAvailable && matches.length && text){
        apiPost('/api/ask', { question: text, candidates: matches.slice(0, 8).map(function(m){ return m.entry; }) })
          .then(function(llm){
            var usedRealMatch = llm && Array.isArray(llm.usedIds) && llm.usedIds.some(function(id){
              return matches.some(function(m){ return m.entry.id === id; });
            });
            if(llm && llm.available && llm.confident && usedRealMatch){
              finish({
                understanding: llm.understanding || reply.understanding,
                answer: llm.answer || reply.answer,
                nextStep: llm.nextStep || reply.nextStep,
                citation: reply.citation, investigate: reply.investigate, missingWhat: reply.missingWhat
              });
            } else {
              finish(reply);
            }
          })
          .catch(function(){ finish(reply); });
      } else {
        finish(reply);
      }
    });
  }

  sendBtn.addEventListener('click', trySend);
  chips.addEventListener('click', function(e){
    var btn = e.target.closest('.chip');
    if(!btn || sendBtn.disabled) return;
    composer.textContent = btn.getAttribute('data-q');
    trySend();
  });

  // ============================================================
  //  KNOWLEDGE BASE VIEW — stats, browse/search, add form, activity
  // ============================================================
  function updateKbStats(){
    var docs = {};
    KB.forEach(function(e){ docs[e.sourceDoc] = true; });
    var docCount = Object.keys(docs).length;
    document.getElementById('kbBadge').textContent = docCount + ' documents · ' + KB.length + ' entries loaded';
    document.getElementById('kbCoverageText').innerHTML = 'Currently grounded in <b>' + docCount + '</b> source documents and <b>' + KB.length + '</b> indexed sections.';
    document.getElementById('statEntries').textContent = KB.length;
    document.getElementById('statDocs').textContent = docCount;
    document.getElementById('statOpen').textContent = tickets.filter(function(t){ return t.status !== 'Resolved'; }).length;
    document.getElementById('statResolved').textContent = tickets.filter(function(t){ return t.status === 'Resolved'; }).length;
    document.getElementById('sidebarFooter').innerHTML = '<b>' + KB.length + '</b> KB entries<br/>Running at <b>' + window.location.host + '</b>';
  }

  function renderKbList(){
    var list = document.getElementById('kbList');
    if(!list) return;
    var q = kbFilter.query.trim().toLowerCase();
    var filtered = !q ? KB : KB.filter(function(e){
      return e.title.toLowerCase().indexOf(q) !== -1 || e.sourceDoc.toLowerCase().indexOf(q) !== -1 || e.answer.toLowerCase().indexOf(q) !== -1;
    });
    document.getElementById('kbListCount').textContent = filtered.length + ' of ' + KB.length + ' entries';
    var shown = filtered.slice(0, 60);
    list.innerHTML = shown.length ? shown.map(function(e){
      return '<div class="kb-row" data-id="' + escapeHtml(e.id) + '"><div class="kt">' + escapeHtml(e.title) + '</div>' +
        '<div class="ks">' + escapeHtml(e.sourceDoc) + ' · p.' + e.page + '</div>' +
        '<div class="ka">' + escapeHtml(excerpt(e.answer, 320)) + '</div></div>';
    }).join('') : '<div class="empty-inline" style="padding:22px;">No entries match your search.</div>';
    if(filtered.length > shown.length){
      list.innerHTML += '<div class="empty-inline">Showing first ' + shown.length + ' results — refine your search to narrow further.</div>';
    }
    Array.prototype.forEach.call(list.querySelectorAll('.kb-row'), function(row){
      row.addEventListener('click', function(){ row.classList.toggle('open'); });
    });
  }
  var kbSearchInput = document.getElementById('kbSearchInput');
  kbSearchInput.addEventListener('input', function(){ kbFilter.query = kbSearchInput.value; globalSearch.value = kbSearchInput.value; renderKbList(); });

  function renderLearningLog(){
    var el = document.getElementById('learnBody');
    if(!el) return;
    el.innerHTML = learningLog.map(function(e){
      return '<div class="learn-item"><span class="ts">' + e.ts + '</span>' + e.text + '</div>';
    }).join('') || '<div class="empty-inline">No activity yet.</div>';
  }

  document.getElementById('kbAddBtn').addEventListener('click', function(){
    var title = document.getElementById('kbTitle').value.trim();
    var source = document.getElementById('kbSource').value.trim() || 'Agent-added';
    var answer = document.getElementById('kbAnswer').value.trim();
    var msg = document.getElementById('kbAddMsg');
    if(!title || !answer){ msg.textContent = 'Title and answer are required.'; msg.style.color = 'var(--danger)'; return; }
    // bug fix: keywords used to be derived from the title only, making new
    // entries hard to retrieve later — now the answer contributes too.
    var titleWords = title.toLowerCase().split(/\W+/).filter(function(w){ return w.length > 3; });
    var answerWords = answer.toLowerCase().split(/\W+/).filter(function(w){ return w.length > 4; }).slice(0, 12);
    var keywords = Array.from(new Set(titleWords.concat(answerWords)));
    var btn = document.getElementById('kbAddBtn');
    btn.disabled = true;
    apiPost('/api/kb', { title:title, sourceDoc:source, page:0, keywords:keywords, answer:answer }).then(function(entry){
      KB.push(entry);
      docFreqCache = null;
      document.getElementById('kbTitle').value = '';
      document.getElementById('kbSource').value = '';
      document.getElementById('kbAnswer').value = '';
      msg.style.color = 'var(--success)';
      msg.textContent = 'Added — the knowledge base now has ' + KB.length + ' entries.';
      btn.disabled = false;
      updateKbStats();
      renderKbList();
      toast('Added to the knowledge base.', 'success');
      loadLog();
    }).catch(function(){
      msg.style.color = 'var(--danger)'; msg.textContent = 'Could not reach the server.'; btn.disabled = false;
      toast('Could not save this entry — check the server is running.', 'danger');
    });
  });

  // ---- Upload a document -> AI-proposed entries -> reviewed -> saved individually via
  // the same POST /api/kb used above. Nothing from an upload is ever saved automatically.
  document.getElementById('kbUploadBtn').addEventListener('click', function(){
    var fileInput = document.getElementById('kbUploadFile');
    var msg = document.getElementById('kbUploadMsg');
    var review = document.getElementById('kbUploadReview');
    var file = fileInput.files && fileInput.files[0];
    if(!file){ msg.style.color = 'var(--danger)'; msg.textContent = 'Choose a file first.'; return; }
    var btn = document.getElementById('kbUploadBtn');
    btn.disabled = true;
    msg.style.color = ''; msg.textContent = 'Reading and analyzing the document…';
    review.innerHTML = '';
    var fd = new FormData();
    fd.append('file', file);
    fetch('/api/upload', { method: 'POST', body: fd })
      .then(function(r){ return r.json().then(function(body){ return { ok: r.ok, body: body }; }); })
      .then(function(res){
        btn.disabled = false;
        if(!res.ok){ msg.style.color = 'var(--danger)'; msg.textContent = res.body.error || 'Upload failed.'; return; }
        var entries = res.body.entries || [];
        if(!entries.length){ msg.style.color = 'var(--danger)'; msg.textContent = 'No entries could be extracted from this document.'; return; }
        msg.style.color = 'var(--success)';
        msg.textContent = entries.length + ' proposed entries — review, edit, and save the ones you want.';
        renderUploadReview(entries, res.body.defaultSourceDoc);
      })
      .catch(function(){
        btn.disabled = false; msg.style.color = 'var(--danger)'; msg.textContent = 'Could not reach the server.';
      });
  });

  function renderUploadReview(entries, defaultSourceDoc){
    var review = document.getElementById('kbUploadReview');
    review.innerHTML = entries.map(function(e, i){
      return '<div class="card mini-card upload-review-row" data-idx="' + i + '" style="margin-top:10px;">' +
        '<label><input type="checkbox" class="ur-include" checked/> Include this entry</label>' +
        '<label>Title</label><input type="text" class="ur-title" value="' + escapeHtml(e.title || '') + '"/>' +
        '<label>Source</label><input type="text" class="ur-source" value="' + escapeHtml(e.sourceDoc || defaultSourceDoc || '') + '"/>' +
        '<label>Keywords (comma-separated)</label><input type="text" class="ur-keywords" value="' + escapeHtml((e.keywords || []).join(', ')) + '"/>' +
        '<label>Answer</label><textarea class="ur-answer" rows="3">' + escapeHtml(e.answer || '') + '</textarea>' +
      '</div>';
    }).join('') + '<button class="btn primary" id="kbUploadSaveBtn" type="button" style="margin-top:10px;">' + ic('plus') + 'Save selected entries</button>';

    document.getElementById('kbUploadSaveBtn').addEventListener('click', function(){
      var rows = Array.prototype.slice.call(document.querySelectorAll('.upload-review-row'));
      var toSave = rows.filter(function(row){ return row.querySelector('.ur-include').checked; }).map(function(row){
        return {
          title: row.querySelector('.ur-title').value.trim(),
          sourceDoc: row.querySelector('.ur-source').value.trim() || 'Uploaded document',
          page: 1,
          keywords: row.querySelector('.ur-keywords').value.split(',').map(function(s){ return s.trim(); }).filter(Boolean),
          answer: row.querySelector('.ur-answer').value.trim()
        };
      }).filter(function(e){ return e.title && e.answer; });
      if(!toSave.length){ toast('Nothing selected to save.', 'danger'); return; }
      var saveBtn = document.getElementById('kbUploadSaveBtn');
      saveBtn.disabled = true;
      Promise.all(toSave.map(function(e){ return apiPost('/api/kb', e); })).then(function(saved){
        saved.forEach(function(entry){ KB.push(entry); });
        docFreqCache = null;
        document.getElementById('kbUploadReview').innerHTML = '';
        document.getElementById('kbUploadFile').value = '';
        var msg = document.getElementById('kbUploadMsg');
        msg.style.color = 'var(--success)';
        msg.textContent = 'Saved ' + saved.length + ' entries — the knowledge base now has ' + KB.length + ' entries.';
        updateKbStats();
        renderKbList();
        toast('Saved ' + saved.length + ' entries from the uploaded document.', 'success');
        loadLog();
      }).catch(function(){
        saveBtn.disabled = false;
        toast('Could not save one or more entries — check the server is running.', 'danger');
      });
    });
  }

  function loadLog(){
    apiGet('/api/log').then(function(entries){
      learningLog = (entries || []).map(function(e){
        var d = new Date(e.ts);
        return { text: e.text, ts: isNaN(d) ? '' : d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) };
      });
      renderLearningLog();
      renderNotifPanel();
    });
  }

  // ============================================================
  //  BOOT — load KB from the local API, then render everything
  // ============================================================
  var appLoading = document.getElementById('appLoading');
  var appShell = document.getElementById('appShell');
  var retryBootBtn = document.getElementById('retryBootBtn');

  // Set once at boot; checked before every LLM-drafted-answer attempt so a missing/unconfigured
  // key skips straight to the local keyword engine instead of a doomed round-trip per message.
  var nexisLlmAvailable = false;

  function boot(){
    appLoading.classList.remove('err-state');
    apiGet('/api/kb').then(function(kb){
      KB = kb || [];
      appLoading.style.display = 'none';
      appShell.classList.add('ready');
      updateKbStats();
      addBotMessage("Hi, I'm Nexis — the product assistant for Modern Requirements4DevOps and Copilot4DevOps. Every answer I give is grounded in the " + KB.length + " indexed sections of product documentation loaded here, and if something isn't covered I'll tell you that rather than guess. Ask me anything, or attach a screenshot, log or document.");
      seedExamples();
      updateKbStats();
      renderKbList();
      loadLog();
      renderQueue();
      apiGet('/api/llm-status').then(function(s){ nexisLlmAvailable = !!(s && s.available); }).catch(function(){ nexisLlmAvailable = false; });
    }).catch(function(){
      appLoading.classList.add('err-state');
    });
  }
  retryBootBtn.addEventListener('click', boot);
  boot();

})();
</script>
</body>
