<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>MR Nexis</title>
<style>
  :root{
    --bg:#FAF9F8; --surface:#FFFFFF; --surface-alt:#F3F2F1; --surface-hover:#F5F5F5;
    --border:#E1DFDD; --border-strong:#C8C6C4;
    --text:#201F1E; --text-2:#494847; --text-muted:#616161;
    --primary:#0078D4; --primary-hover:#106EBE; --primary-active:#005A9E; --primary-soft:#EFF6FC; --on-primary:#FFFFFF;
    --success:#107C10; --success-soft:#DFF6DD;
    --warning:#8A5700; --warning-soft:#FFF4CE;
    --danger:#A4262C; --danger-soft:#FDE7E9;
    --info:#0078D4; --info-soft:#EFF6FC;
    --shadow-xs:0 1px 2px rgba(0,0,0,.05);
    --shadow-sm:0 1px 2px rgba(0,0,0,.06), 0 1px 6px rgba(0,0,0,.05);
    --shadow-md:0 3px 10px rgba(0,0,0,.09), 0 0 1px rgba(0,0,0,.1);
    --shadow-lg:0 10px 28px rgba(0,0,0,.14), 0 2px 8px rgba(0,0,0,.08);
    --radius-sm:4px; --radius-md:8px; --radius-lg:12px;
    --sidebar-w:236px; --sidebar-w-collapsed:60px; --header-h:52px;
    --ease:cubic-bezier(.2,.8,.2,1);
  }
  html[data-theme="dark"]{
    --bg:#1B1A19; --surface:#252423; --surface-alt:#2D2C2B; --surface-hover:#333231;
    --border:#3B3A39; --border-strong:#484644;
    --text:#F3F2F1; --text-2:#D2D0CE; --text-muted:#A6A4A2;
    --primary:#3AA0F3; --primary-hover:#5CB1F5; --primary-active:#1F8AE0; --primary-soft:#0D2A42; --on-primary:#062033;
    --success:#6CCB5F; --success-soft:#0F2E12;
    --warning:#FCE100; --warning-soft:#3B2F00;
    --danger:#F1707B; --danger-soft:#3B1113;
    --info:#3AA0F3; --info-soft:#0D2A42;
    --shadow-xs:0 1px 2px rgba(0,0,0,.3);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4), 0 1px 6px rgba(0,0,0,.3);
    --shadow-md:0 3px 10px rgba(0,0,0,.45), 0 0 1px rgba(0,0,0,.4);
    --shadow-lg:0 10px 28px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:"Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  button, input, textarea, select{font:inherit; color:inherit;}
  button{cursor:pointer;}
  *:focus-visible{outline:2px solid var(--primary); outline-offset:1px; border-radius:4px;}
  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:99px; border:2px solid transparent; background-clip:padding-box;}
  ::-webkit-scrollbar-track{background:transparent;}
  svg{display:block;}
  .visually-hidden{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;}

  /* ---------------- boot / loading ---------------- */
  .app-loading{position:fixed; inset:0; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; z-index:999;}
  .spinner{width:34px; height:34px; border-radius:50%; border:3px solid var(--border); border-top-color:var(--primary); animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .app-loading p{color:var(--text-muted); font-size:13px; margin:0;}
  .app-loading .err{display:none; flex-direction:column; align-items:center; gap:10px;}
  .app-loading.err-state .spinner, .app-loading.err-state .loading-text{display:none;}
  .app-loading.err-state .err{display:flex;}

  /* ---------------- shell ---------------- */
  .app-shell{display:none; height:100vh; flex-direction:column;}
  .app-shell.ready{display:flex;}

  .topbar{
    height:var(--header-h); flex-shrink:0; display:flex; align-items:center; gap:10px; padding:0 12px;
    background:linear-gradient(180deg,#ffffff,#fcfcfd); border-bottom:1px solid var(--border); box-shadow:var(--shadow-xs); position:relative; z-index:30;
  }
  html[data-theme="dark"] .topbar{background:linear-gradient(180deg,#252423,#221f1e);}
  .icon-btn{
    width:32px; height:32px; display:flex; align-items:center; justify-content:center; border-radius:var(--radius-sm);
    border:1px solid transparent; background:transparent; color:var(--text-2); position:relative; transition:background .12s var(--ease), color .12s;
  }
  .icon-btn:hover{background:var(--surface-alt); color:var(--text);}
  .icon-btn svg{width:17px; height:17px;}
  .brand{display:flex; align-items:center; gap:9px; padding-right:6px; flex-shrink:0;}
  .brand-mark{width:28px; height:28px; border-radius:7px; background:linear-gradient(155deg,var(--primary),var(--primary-active)); color:var(--on-primary); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px; letter-spacing:-.02em; box-shadow:var(--shadow-xs);}
  .brand-name{display:flex; flex-direction:column; line-height:1.15;}
  .brand-name b{font-size:13.5px; font-weight:600;}
  .brand-name span{font-size:10.5px; color:var(--text-muted); letter-spacing:.02em;}
  .topbar-search{flex:1; max-width:420px; position:relative; display:flex; align-items:center;}
  .topbar-search svg{position:absolute; left:10px; width:15px; height:15px; color:var(--text-muted); pointer-events:none;}
  .topbar-search input{
    width:100%; height:32px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--surface-alt);
    padding:0 10px 0 32px; font-size:13px; transition:border-color .12s, background .12s;
  }
  .topbar-search input:focus{background:var(--surface); border-color:var(--primary); outline:none;}
  .topbar-actions{display:flex; align-items:center; gap:4px; margin-left:auto; flex-shrink:0; position:relative;}
  .notif-dot{position:absolute; top:6px; right:6px; width:7px; height:7px; border-radius:50%; background:var(--danger); border:1.5px solid var(--surface);}
  .avatar-chip{width:28px; height:28px; border-radius:50%; background:var(--surface-alt); border:1px solid var(--border); color:var(--text-2); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600; margin-left:4px;}

  .notif-panel{
    position:absolute; top:40px; right:0; width:340px; max-height:420px; overflow-y:auto; background:var(--surface);
    border:1px solid var(--border); border-radius:var(--radius-md); box-shadow:var(--shadow-lg); padding:6px; z-index:40;
    animation:pop .14s var(--ease);
  }
  @keyframes pop{from{opacity:0; transform:translateY(-4px) scale(.98);} to{opacity:1; transform:none;}}
  .notif-panel h4{margin:6px 8px; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-muted);}
  .notif-item{padding:8px 9px; border-radius:var(--radius-sm); font-size:12.5px; line-height:1.5;}
  .notif-item:hover{background:var(--surface-alt);}
  .notif-item .ts{font-size:10.5px; color:var(--text-muted); display:block; margin-top:2px;}

  .app-body{flex:1; display:flex; min-height:0;}
  .sidebar{
    width:var(--sidebar-w); flex-shrink:0; background:var(--surface); border-right:1px solid var(--border);
    display:flex; flex-direction:column; padding:10px 8px; gap:2px; transition:width .16s var(--ease);
    overflow-x:hidden;
  }
  .sidebar.collapsed{width:var(--sidebar-w-collapsed);}
  .nav-item{
    display:flex; align-items:center; gap:11px; padding:9px 10px; border-radius:var(--radius-sm); border:none;
    background:none; color:var(--text-2); font-size:13px; font-weight:500; text-align:left; white-space:nowrap; width:100%;
    transition:background .12s var(--ease), color .12s;
  }
  .nav-item svg{width:17px; height:17px; flex-shrink:0; color:var(--text-muted); transition:color .12s;}
  .nav-item:hover{background:var(--surface-alt); color:var(--text);}
  .nav-item.active{background:var(--primary-soft); color:var(--primary);}
  .nav-item.active svg{color:var(--primary);}
  .nav-item span.label{overflow:hidden; text-overflow:ellipsis; flex:1;}
  .sidebar.collapsed .nav-item span.label, .sidebar.collapsed .nav-item .nav-badge, .sidebar.collapsed .sidebar-footer{display:none;}
  .nav-badge{font-size:10.5px; font-weight:700; background:var(--danger); color:#fff; border-radius:99px; padding:1px 6px; min-width:16px; text-align:center;}
  .nav-item.active .nav-badge{background:var(--primary);}
  .sidebar-footer{margin-top:auto; padding:10px 8px 4px; font-size:11px; color:var(--text-muted); line-height:1.6; border-top:1px solid var(--border);}
  .sidebar-footer b{color:var(--text-2);}

  .main-content{flex:1; min-width:0; overflow-y:auto; background:var(--bg);}
  .view-panel{display:none; padding:18px 22px 32px; max-width:1400px; margin:0 auto;}
  .view-panel.active{display:block;}

  /* ---------------- generic cards ---------------- */
  .card{
    background:linear-gradient(180deg,#ffffff,#fdfdfd); border:1px solid var(--border); border-radius:var(--radius-lg);
    box-shadow:var(--shadow-sm); transition:box-shadow .15s var(--ease);
  }
  html[data-theme="dark"] .card{background:linear-gradient(180deg,#262524,#242322);}
  .page-title-row{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; flex-wrap:wrap;}
  .page-title-row h1{font-size:19px; font-weight:600; margin:0;}
  .page-title-row p{margin:2px 0 0; font-size:12.5px; color:var(--text-muted);}

  .btn{
    display:inline-flex; align-items:center; gap:7px; border-radius:var(--radius-sm); padding:7px 14px; font-size:12.8px;
    font-weight:600; border:1px solid var(--border); background:var(--surface); color:var(--text); transition:all .12s var(--ease);
    white-space:nowrap;
  }
  .btn svg{width:14px; height:14px;}
  .btn:hover{background:var(--surface-alt); border-color:var(--border-strong);}
  .btn:active{transform:translateY(1px);}
  .btn.primary{background:var(--primary); color:var(--on-primary); border-color:var(--primary);}
  .btn.primary:hover{background:var(--primary-hover); border-color:var(--primary-hover);}
  .btn.danger-ghost{color:var(--danger); border-color:var(--border);}
  .btn.danger-ghost:hover{background:var(--danger-soft); border-color:var(--danger);}
  .btn.ghost{border-color:transparent; background:transparent;}
  .btn.ghost:hover{background:var(--surface-alt);}
  .btn:disabled{opacity:.5; cursor:default; transform:none;}
  .btn.sm{padding:5px 10px; font-size:12px;}

  .badge{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; border-radius:99px; padding:3px 9px; display:inline-flex; align-items:center; gap:5px;}
  .badge::before{content:''; width:6px; height:6px; border-radius:50%; background:currentColor;}
  .badge.new{background:var(--info-soft); color:var(--info);}
  .badge.progress{background:var(--warning-soft); color:var(--warning);}
  .badge.escalated{background:var(--danger-soft); color:var(--danger);}
  .badge.resolved{background:var(--success-soft); color:var(--success);}
  .pr-dot{width:7px; height:7px; border-radius:50%; flex-shrink:0;}
  .pr-dot.high{background:var(--danger);} .pr-dot.medium{background:var(--warning);} .pr-dot.low{background:var(--success);}

  .toast-root{position:fixed; top:64px; right:16px; display:flex; flex-direction:column; gap:8px; z-index:200; width:320px; max-width:calc(100vw - 32px);}
  .toast{
    background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--info); border-radius:var(--radius-md);
    box-shadow:var(--shadow-lg); padding:10px 12px; display:flex; gap:9px; align-items:flex-start; font-size:12.8px;
    animation:toastIn .18s var(--ease);
  }
  @keyframes toastIn{from{opacity:0; transform:translateX(12px);} to{opacity:1; transform:none;}}
  .toast.leaving{animation:toastOut .15s var(--ease) forwards;}
  @keyframes toastOut{to{opacity:0; transform:translateX(12px);}}
  .toast.success{border-left-color:var(--success);}
  .toast.warning{border-left-color:var(--warning);}
  .toast.danger{border-left-color:var(--danger);}
  .toast svg{width:16px; height:16px; flex-shrink:0; margin-top:1px;}
  .toast.success svg{color:var(--success);} .toast.warning svg{color:var(--warning);} .toast.danger svg{color:var(--danger);} .toast.info svg{color:var(--info);}
  .toast .msg{flex:1; line-height:1.45;}
  .toast .close{flex-shrink:0; width:16px; height:16px; color:var(--text-muted); border-radius:3px;}
  .toast .close:hover{color:var(--text);}

  /* ---------------- customer portal ---------------- */
  .customer-grid{display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,.75fr); gap:16px; align-items:start;}
  .chat-panel{display:flex; flex-direction:column; min-height:0; position:relative; overflow:hidden;}
  .chat-header{padding:14px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px;}
  .chat-avatar{width:32px; height:32px; border-radius:9px; background:linear-gradient(155deg,var(--primary),var(--primary-active)); color:var(--on-primary); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex-shrink:0;}
  .chat-header-text strong{font-size:13.5px; font-weight:600; display:block;}
  .chat-status{font-size:11.5px; color:var(--text-muted); display:flex; align-items:center; gap:5px;}
  .chat-status .pip{width:6px; height:6px; border-radius:50%; background:var(--success);}
  .chat-body{flex:1; min-height:380px; max-height:480px; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px;}
  .msg{max-width:88%; display:flex; flex-direction:column; gap:4px;}
  .msg.user{align-self:flex-end; align-items:flex-end;}
  .msg.bot{align-self:flex-start; align-items:flex-start;}
  .msg-label{font-size:10.5px; color:var(--text-muted); padding:0 3px; font-weight:600; text-transform:uppercase; letter-spacing:.03em;}
  .bubble{padding:9px 12px; border-radius:12px; font-size:13.5px; line-height:1.6; white-space:pre-wrap; word-break:break-word;}
  .msg.user .bubble{background:var(--primary); color:var(--on-primary); border-bottom-right-radius:3px;}
  .msg.bot .bubble{background:var(--surface-alt); color:var(--text); border-bottom-left-radius:3px;}
  .cite{font-size:11px; color:var(--primary); background:var(--primary-soft); border-radius:6px; padding:4px 9px; width:fit-content;}
  .investigate-note{font-size:11px; border-radius:6px; padding:4px 9px; width:fit-content; max-width:100%; display:flex; flex-direction:column; gap:2px;}
  .investigate-note.needed{color:var(--warning); background:var(--warning-soft);}
  .investigate-note.clear{color:var(--success); background:var(--success-soft);}
  .investigate-note b{font-weight:700;}
  .bubble .rsec{margin-bottom:9px;}
  .bubble .rsec:last-child{margin-bottom:0;}
  .bubble .rsec b{font-size:11px; text-transform:uppercase; letter-spacing:.04em; opacity:.72;}
  .bubble img.inline-img{max-width:220px; border-radius:8px; display:block; margin:4px 0; border:1px solid rgba(0,0,0,.12);}
  .file-chip{display:inline-flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--border); border-radius:7px; padding:4px 9px 4px 6px; font-size:11.5px; margin:3px 4px 3px 0;}
  .file-chip svg{width:12px; height:12px; flex-shrink:0;}
  .msg.user .file-chip{background:rgba(255,255,255,.15); border-color:rgba(255,255,255,.32); color:var(--on-primary);}
  .typing{display:flex; gap:4px; padding:11px 13px; background:var(--surface-alt); border-radius:12px; border-bottom-left-radius:3px; align-self:flex-start; width:fit-content;}
  .typing span{width:5px; height:5px; border-radius:50%; background:var(--text-muted); opacity:.5; animation:blink 1.1s infinite;}
  .typing span:nth-child(2){animation-delay:.15s;} .typing span:nth-child(3){animation-delay:.3s;}
  @keyframes blink{0%,80%,100%{opacity:.25; transform:translateY(0);} 40%{opacity:.9; transform:translateY(-2px);}}
  .chip-row{display:flex; flex-wrap:wrap; gap:6px; padding:0 16px 12px;}
  .chip{font-size:12px; background:var(--surface-alt); color:var(--text-2); border:1px solid var(--border); border-radius:999px; padding:6px 12px; transition:border-color .12s, color .12s;}
  .chip:hover{border-color:var(--primary); color:var(--primary);}

  .dropzone{position:relative;}
  .dropzone.dragover::after{content:'Drop screenshots, logs, or documents to attach'; position:absolute; inset:8px; border:2px dashed var(--primary); border-radius:var(--radius-md); background:var(--primary-soft); display:flex; align-items:center; justify-content:center; font-weight:600; font-size:13px; color:var(--primary); pointer-events:none; z-index:5;}

  .composer-wrap{border-top:1px solid var(--border);}
  .composer-toolbar{display:flex; align-items:center; gap:6px; padding:7px 12px; border-bottom:1px solid var(--border);}
  .tbtn{width:27px; height:27px; border-radius:6px; border:1px solid transparent; background:none; color:var(--text-muted); display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:700; flex-shrink:0; transition:background .12s, color .12s;}
  .tbtn svg{width:14px; height:14px;}
  .tbtn:hover{background:var(--surface-alt); color:var(--text);}
  .tbtn.active{background:var(--primary-soft); color:var(--primary);}
  .tb-sep{width:1px; height:16px; background:var(--border); margin:0 2px; flex-shrink:0;}
  #composer{min-height:60px; max-height:140px; overflow-y:auto; padding:11px 14px; font-size:13.5px; line-height:1.6; outline:none;}
  #composer:empty::before{content:attr(data-placeholder); color:var(--text-muted);}
  .composer-actions{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:9px 12px; border-top:1px solid var(--border);}
  .composer-hint{font-size:11px; color:var(--text-muted);}

  .side-rail{display:flex; flex-direction:column; gap:14px;}
  .mini-card{padding:14px 16px; display:flex; flex-direction:column; gap:9px;}
  .mini-card h3{font-size:12.5px; margin:0; font-weight:600;}
  .status-row{display:flex; align-items:center; justify-content:space-between; font-size:12px; color:var(--text-muted);}
  .status-row b{color:var(--text); font-weight:600;}
  .kb-stat{font-size:12px; color:var(--text-muted); line-height:1.6; margin:0;}
  .kb-stat b{color:var(--primary);}

  @media (max-width:900px){ .customer-grid{grid-template-columns:1fr;} }

  /* ---------------- agent console ---------------- */
  .console-layout{display:grid; grid-template-columns:280px minmax(0,1fr); gap:16px; align-items:start;}
  .queue-panel{display:flex; flex-direction:column; max-height:calc(100vh - var(--header-h) - 60px); position:sticky; top:0;}
  .queue-toolbar{padding:12px 12px 10px; border-bottom:1px solid var(--border); display:flex; flex-direction:column; gap:8px;}
  .queue-search{position:relative; display:flex; align-items:center;}
  .queue-search svg{position:absolute; left:8px; width:13px; height:13px; color:var(--text-muted); pointer-events:none;}
  .queue-search input{width:100%; height:29px; border-radius:6px; border:1px solid var(--border); background:var(--surface-alt); padding:0 8px 0 27px; font-size:12.3px;}
  .queue-search input:focus{background:var(--surface); border-color:var(--primary); outline:none;}
  .filter-row{display:flex; gap:6px;}
  .filter-row select{flex:1; min-width:0; height:28px; border-radius:6px; border:1px solid var(--border); background:var(--surface); font-size:11.8px; padding:0 6px;}
  .queue-list{flex:1; overflow-y:auto; display:flex; flex-direction:column;}
  .queue-item{display:flex; flex-direction:column; gap:5px; padding:11px 13px; border-bottom:1px solid var(--border); text-align:left; background:none; border-left:3px solid transparent; width:100%; transition:background .12s;}
  .queue-item:hover{background:var(--surface-alt);}
  .queue-item.active{background:var(--primary-soft); border-left-color:var(--primary);}
  .queue-item .qtop{display:flex; align-items:center; justify-content:space-between; gap:6px;}
  .queue-item .qsubj{font-size:12.3px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .queue-item .qmeta{font-size:10.8px; color:var(--text-muted); display:flex; align-items:center; gap:6px;}
  .queue-empty{padding:28px 16px; text-align:center; color:var(--text-muted); font-size:12.5px;}

  .ticket-detail{min-height:400px;}
  .detail-empty{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:80px 20px; color:var(--text-muted); text-align:center;}
  .detail-empty svg{width:38px; height:38px; opacity:.35;}

  .detail-card{background:linear-gradient(180deg,#ffffff,#fdfdfd); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); margin-bottom:14px;}
  html[data-theme="dark"] .detail-card{background:linear-gradient(180deg,#262524,#242322);}
  .detail-header{padding:16px 18px; display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap;}
  .detail-header h2{font-size:16.5px; margin:0 0 3px; font-weight:600;}
  .detail-header .meta{font-size:11.8px; color:var(--text-muted);}

  .expand-card{margin-bottom:14px; overflow:hidden;}
  .expand-header{display:flex; align-items:center; gap:9px; padding:13px 16px; width:100%; background:none; border:none; text-align:left;}
  .expand-header:hover{background:var(--surface-alt);}
  .expand-header svg.section-icon{width:16px; height:16px; color:var(--primary); flex-shrink:0;}
  .expand-header .etitle{font-size:13.3px; font-weight:600; flex:1;}
  .expand-header .ecount{font-size:11px; color:var(--text-muted); font-weight:500;}
  .expand-header svg.chev{width:14px; height:14px; color:var(--text-muted); transition:transform .15s var(--ease); flex-shrink:0;}
  .expand-card.collapsed .expand-header svg.chev{transform:rotate(-90deg);}
  .expand-body{padding:2px 16px 16px;}
  .expand-card.collapsed .expand-body{display:none;}

  .analysis-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px; margin-bottom:12px;}
  .a-field{display:flex; flex-direction:column; gap:3px; background:var(--surface-alt); border-radius:8px; padding:9px 11px;}
  .a-field .lbl{font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); font-weight:600;}
  .a-field .val{font-size:13px; font-weight:600;}
  .meter-row{display:flex; align-items:center; gap:10px;}
  .meter{flex:1; height:6px; border-radius:99px; background:var(--border); overflow:hidden;}
  .meter > i{display:block; height:100%; background:var(--primary); border-radius:99px; transition:width .5s var(--ease);}
  .meter-num{font-size:11.5px; color:var(--text-muted); width:3.4em; text-align:right; font-variant-numeric:tabular-nums;}

  .followup-card{border:1px solid color-mix(in srgb, var(--warning) 40%, var(--border)); background:var(--warning-soft); border-radius:10px; padding:11px 13px; display:flex; flex-direction:column; gap:5px; margin-top:12px;}
  .followup-card .ttl{font-weight:600; font-size:12.3px; color:var(--warning); display:flex; align-items:center; gap:6px;}
  .followup-card ul{margin:0; padding-left:18px; font-size:12.3px; line-height:1.6;}
  .escalation-block{border:1px solid color-mix(in srgb, var(--danger) 40%, var(--border)); background:var(--danger-soft); border-radius:10px; padding:12px 14px; display:flex; flex-direction:column; gap:7px; margin-top:12px;}
  .escalation-block .ttl{font-weight:700; font-size:12.6px; color:var(--danger); display:flex; align-items:center; gap:6px;}
  .escalation-block pre{white-space:pre-wrap; font-family:ui-monospace,Consolas,monospace; font-size:11.2px; line-height:1.6; margin:0; color:var(--text-2);}

  .transcript-list{display:flex; flex-direction:column; gap:10px; max-height:280px; overflow-y:auto; margin-bottom:10px;}
  .attach-row{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;}

  .match-card{border:1px solid var(--border); background:var(--surface-alt); border-radius:10px; padding:11px 12px; display:flex; flex-direction:column; gap:5px; margin-bottom:9px; cursor:pointer; transition:border-color .12s;}
  .match-card:hover{border-color:var(--primary);}
  .match-card:last-child{margin-bottom:0;}
  .match-card .mtitle{font-weight:600; font-size:12.6px;}
  .match-card .msrc{font-size:10.8px; color:var(--primary);}
  .match-card .mexcerpt{font-size:11.8px; color:var(--text-muted); line-height:1.5; display:none;}
  .match-card.open .mexcerpt{display:block;}
  .empty-inline{text-align:center; color:var(--text-muted); font-size:12.3px; padding:14px 0;}

  .editor-toolbar{display:flex; align-items:center; gap:3px; padding:7px 9px; background:var(--surface-alt); border:1px solid var(--border); border-bottom:none; border-radius:var(--radius-md) var(--radius-md) 0 0; flex-wrap:wrap;}
  .editor-wrap{border:1px solid var(--border); border-radius:0 0 var(--radius-md) var(--radius-md); overflow:hidden;}
  #responseEditor{min-height:150px; max-height:320px; overflow-y:auto; padding:13px 15px; font-size:13.3px; line-height:1.68; outline:none; background:var(--surface);}
  #responseEditor ul, #responseEditor ol{margin:6px 0; padding-left:22px;}
  #responseEditor a{color:var(--primary);}
  .editor-footer{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 12px; border:1px solid var(--border); border-top:none; border-radius:0 0 var(--radius-md) var(--radius-md); background:var(--surface-alt); margin-top:-1px;}
  .ai-actions{display:flex; gap:6px; flex-wrap:wrap;}
  .response-attach-row{display:flex; flex-wrap:wrap; gap:6px; margin:10px 0;}
  .action-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:14px;}
  .action-row .spacer{flex:1;}

  /* ---------------- knowledge base view ---------------- */
  .kb-stats-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:16px;}
  .stat-card{padding:14px 16px; display:flex; flex-direction:column; gap:4px;}
  .stat-card .num{font-size:22px; font-weight:700;}
  .stat-card .lbl{font-size:11.5px; color:var(--text-muted);}
  .kb-search-row{display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--border);}
  .kb-search-row .queue-search{flex:1;}
  .kb-list{max-height:520px; overflow-y:auto;}
  .kb-row{padding:12px 16px; border-bottom:1px solid var(--border); display:flex; flex-direction:column; gap:3px; cursor:pointer;}
  .kb-row:hover{background:var(--surface-alt);}
  .kb-row .kt{font-size:13px; font-weight:600;}
  .kb-row .ks{font-size:11.3px; color:var(--primary);}
  .kb-row .ka{font-size:11.8px; color:var(--text-muted); line-height:1.5; display:none;}
  .kb-row.open .ka{display:block; margin-top:2px;}

  .form-grid{display:flex; flex-direction:column; gap:10px; padding:14px 16px;}
  .form-grid label{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); font-weight:600; margin-bottom:-4px;}
  .form-grid input, .form-grid textarea{background:var(--surface); border:1px solid var(--border); border-radius:7px; padding:8px 10px; font-size:12.8px; width:100%; resize:vertical;}
  .form-grid input:focus, .form-grid textarea:focus{border-color:var(--primary); outline:none;}
  .form-msg{font-size:12px; min-height:16px;}

  .learn-list{padding:12px 16px; display:flex; flex-direction:column; gap:9px; max-height:260px; overflow-y:auto;}
  .learn-item{font-size:12px; line-height:1.55; border-left:2px solid var(--primary); padding:3px 0 3px 10px; color:var(--text-muted);}
  .learn-item b{color:var(--text);}
  .learn-item .ts{font-size:10.3px; opacity:.75; display:block;}

  .card-header-row{display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--border); width:100%; background:none; border-left:none; border-right:none; border-top:none; text-align:left;}
  .card-header-row h3{font-size:13.3px; margin:0; font-weight:600;}
  .card-header-row .chev{width:14px; height:14px; color:var(--text-muted); transition:transform .15s;}
  .collapsible.collapsed .chev{transform:rotate(-90deg);}
  .collapsible.collapsed .coll-body{display:none;}
  .kb-mb{margin-bottom:14px;}

  /* ---------------- responsive ---------------- */
  @media (max-width:1180px){
    .sidebar{position:fixed; top:var(--header-h); left:0; bottom:0; z-index:25; box-shadow:var(--shadow-lg); width:var(--sidebar-w); transform:translateX(-100%); transition:transform .18s var(--ease);}
    .sidebar.mobile-open{transform:translateX(0);}
    .sidebar.collapsed{width:var(--sidebar-w);}
    .topbar-search{max-width:260px;}
  }
  @media (max-width:900px){
    .console-layout{grid-template-columns:1fr;}
    .queue-panel{position:static; max-height:340px;}
  }
  @media (max-width:640px){
    .topbar-search{display:none;}
    .view-panel{padding:14px 12px 26px;}
    .brand-name span{display:none;}
  }

  .resp-dropzone{position:relative; border-radius:var(--radius-md); transition:outline-color .12s;}
  .resp-dropzone.dragover{outline:2px dashed var(--primary); outline-offset:3px; background:var(--primary-soft);}
  .confirm-inline{display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--danger); font-weight:600;}

  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }
</style>
</head>
<body>

<div class="app-loading" id="appLoading">
  <div class="spinner"></div>
  <p class="loading-text">Loading MR Nexis console…</p>
  <div class="err">
    <p style="color:var(--danger); font-weight:600;">Can't reach the local server</p>
    <p style="max-width:34ch; text-align:center;">Make sure the server is running (<code>npm start</code>) and this page is loaded from that server, then retry.</p>
    <button class="btn primary" id="retryBootBtn" type="button">Retry connection</button>
  </div>
</div>

<div class="app-shell" id="appShell">
  <header class="topbar">
    <button class="icon-btn" id="sidebarToggle" aria-label="Toggle navigation" title="Toggle navigation"></button>
    <div class="brand"><span class="brand-mark">NX</span><span class="brand-name"><b>MR Nexis</b></span></div>
    <div class="topbar-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="search" id="globalSearch" placeholder="Search tickets…" autocomplete="off"/>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="notifBtn" aria-haspopup="true" aria-expanded="false" title="Activity"><span class="notif-dot" id="notifDot" hidden></span></button>
      <div class="notif-panel" id="notifPanel" hidden></div>
      <button class="icon-btn" id="themeToggle" title="Toggle dark mode"></button>
      <div class="avatar-chip" title="Local agent session">NX</div>
    </div>
  </header>

  <div class="app-body">
    <nav class="sidebar" id="sidebar">
      <button class="nav-item active" data-view="customer" type="button"></button>
      <button class="nav-item" data-view="console" type="button"></button>
      <button class="nav-item" data-view="kb" type="button"></button>
      <div class="sidebar-footer" id="sidebarFooter">Loading knowledge base…</div>
    </nav>

    <main class="main-content" id="mainContent">
      <section class="view-panel active" id="viewCustomer"></section>
      <section class="view-panel" id="viewConsole"></section>
      <section class="view-panel" id="viewKb"></section>
    </main>
  </div>
</div>

<div class="toast-root" id="toastRoot" aria-live="polite"></div>

<script>
(function(){
  "use strict";

  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ============================================================
  //  ICONS (inline SVG, Feather-style, currentColor)
  // ============================================================
  var ICONS = {
    menu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>',
    search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>',
    sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><line x1="12" y1="1.5" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22.5"/><line x1="1.5" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22.5" y2="12"/><line x1="4.5" y1="4.5" x2="6.2" y2="6.2"/><line x1="17.8" y1="17.8" x2="19.5" y2="19.5"/><line x1="4.5" y1="19.5" x2="6.2" y2="17.8"/><line x1="17.8" y1="6.2" x2="19.5" y2="4.5"/></svg>',
    moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>',
    bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>',
    chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
    inbox:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>',
    book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
    chevDown:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>',
    link:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l2-2a5 5 0 0 0-7-7l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.5-.5l-2 2a5 5 0 0 0 7 7l1.5-1.5"/></svg>',
    eraser:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H8l-6-6a2 2 0 0 1 0-2.8L13.2 2a2 2 0 0 1 2.8 0l5.8 5.8a2 2 0 0 1 0 2.8L12 20"/></svg>',
    undo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h10a5 5 0 0 1 0 10H8"/><polyline points="7 5 3 10 7 15"/></svg>',
    redo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10H11a5 5 0 0 0 0 10h5"/><polyline points="17 5 21 10 17 15"/></svg>',
    copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
    paperclip:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.4 11.1 12.3 20a5 5 0 0 1-7-7L14.1 4.2a3.5 3.5 0 0 1 5 5L10.6 17.6a2 2 0 0 1-2.9-2.9l7.8-7.8"/></svg>',
    image:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>',
    file:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>',
    x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
    check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
    flag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="3"/></svg>',
    refresh:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><polyline points="23 20 23 14 17 14"/><path d="M20.5 9a9 9 0 0 0-15-4.4L1 10m22 4-4.5 5.4A9 9 0 0 1 3.5 15"/></svg>',
    sparkles:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8"/></svg>',
    wand:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 4 1.5 1.5M4 20l9-9M12.5 6.5l5 5M18 3l1 1M21 6l1 1M3 18l1 1"/></svg>',
    send:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>',
    plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
    trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
    alert:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
    info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>',
    docCheck:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><polyline points="9 15 11 17 15 12.5"/></svg>'
  };
  function ic(name, cls){ return (ICONS[name]||'').replace('<svg ', '<svg class="'+(cls||'')+'" '); }

  // ============================================================
  //  TOASTS
  // ============================================================
  var toastRoot = document.getElementById('toastRoot');
  function toast(message, type, timeout){
    type = type || 'info';
    var el = document.createElement('div');
    el.className = 'toast ' + type;
    var iconName = type === 'success' ? 'check' : (type === 'danger' ? 'alert' : (type === 'warning' ? 'alert' : 'info'));
    el.innerHTML = ic(iconName) + '<span class="msg"></span><button class="icon-btn close" type="button" aria-label="Dismiss">' + ic('x') + '</button>';
    el.querySelector('.msg').textContent = message;
    toastRoot.appendChild(el);
    function remove(){
      if(!el.parentNode) return;
      el.classList.add('leaving');
      setTimeout(function(){ el.remove(); }, reduceMotion ? 0 : 160);
    }
    el.querySelector('.close').addEventListener('click', remove);
    setTimeout(remove, timeout || 4200);
    return el;
  }

  // ============================================================
  //  THEME + SIDEBAR TOGGLES
  // ============================================================
  var themeToggle = document.getElementById('themeToggle');
  function applyTheme(t){
    document.documentElement.setAttribute('data-theme', t);
    themeToggle.innerHTML = ic(t === 'dark' ? 'sun' : 'moon');
    themeToggle.title = t === 'dark' ? 'Switch to light mode' : 'Switch to dark mode';
    try{ localStorage.setItem('mr-nexis-theme', t); }catch(e){}
  }
  (function initTheme(){
    var saved = null;
    try{ saved = localStorage.getItem('mr-nexis-theme'); }catch(e){}
    applyTheme(saved === 'dark' ? 'dark' : 'light');
  })();
  themeToggle.addEventListener('click', function(){
    var cur = document.documentElement.getAttribute('data-theme');
    applyTheme(cur === 'dark' ? 'light' : 'dark');
  });

  var sidebar = document.getElementById('sidebar');
  var sidebarToggle = document.getElementById('sidebarToggle');
  sidebarToggle.innerHTML = ic('menu');
  function isMobile(){ return window.innerWidth <= 1180; }
  sidebarToggle.addEventListener('click', function(){
    if(isMobile()){ sidebar.classList.toggle('mobile-open'); }
    else { sidebar.classList.toggle('collapsed'); }
  });
  document.addEventListener('click', function(e){
    if(isMobile() && sidebar.classList.contains('mobile-open') && !sidebar.contains(e.target) && e.target !== sidebarToggle && !sidebarToggle.contains(e.target)){
      sidebar.classList.remove('mobile-open');
    }
  });

  // ============================================================
  //  TINY FETCH HELPERS TO THE LOCAL API
  // ============================================================
  function apiGet(url){ return fetch(url).then(function(r){ return r.json(); }); }
  function apiPost(url, body){
    return fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) }).then(function(r){ return r.json(); });
  }
  function apiPatch(url, body){
    return fetch(url, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) }).then(function(r){ return r.json(); });
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
  }
  function excerpt(text, len){
    var t = String(text).replace(/\n+/g, ' ');

    { name: 'AI Sync Bridge', product: 'AI Sync Bridge', match: ['ai sync bridge', 'sync bridge'] },
    // The base product itself — "MR", "tell me about MR4DevOps" — as opposed to any of its
    // individual features above. Kept last and filtered below so it never outranks or gets
    // treated as a second topic alongside a more specific feature also named in the same message.
    { name: 'Modern Requirements4DevOps', product: 'MR4DevOps', match: ['modern requirements4devops'] }
  ];
  function detectEntities(normalized){
    var found = [];
    ENTITIES.forEach(function(ent){
      for(var i = 0; i < ent.match.length; i++){
        if(normalized.indexOf(ent.match[i]) !== -1){
          found.push({ name: ent.name, product: ent.product, match: ent.match[i] });
          return;
        }
      }
    });
    // A generic "...in Modern Requirements4DevOps" mention alongside a named feature isn't a
    // second topic — drop the umbrella-product match so it doesn't manufacture false ambiguity
    // between (say) "Baseline" and the product Baseline is part of.
    if(found.length > 1){
      found = found.filter(function(e){ return e.name !== 'Modern Requirements4DevOps'; });
    }
    return found;
  }

  function classifyIntent(normalized){
    if(/licen|activation|seat|subscription/.test(normalized)) return 'licensing';
    if(/slow|performance|lag|timeout|hang|takes too long/.test(normalized)) return 'performance';
    if(/error|fail|exception|crash|broken|not working|doesn t work|does not work|unable to/.test(normalized)) return 'error';
    if(/difference between|compare|versus| vs /.test(normalized)) return 'comparison';
    if(/limit|maximum|max |restrict|not supported|can t we|cannot/.test(normalized)) return 'limitation';
    if(/compatib|supported version|works with|browser|operating system/.test(normalized)) return 'compatibility';
    if(/known issue|bug|defect/.test(normalized)) return 'known-issue';
    if(/integrat|connect|sync|api/.test(normalized)) return 'integration';
    if(/upgrade|update to|migrat|version|patch|release/.test(normalized)) return 'version-diff';
    if(/config|setting|set up|setup|enable|disable|install/.test(normalized)) return 'config';
    if(/should it|supposed to|expected|is it normal/.test(normalized)) return 'expected-vs-unexpected';
    if(/what is|what does|how does|how do|how can|explain|where is/.test(normalized)) return 'how-it-works';
    return 'general-info';
  }

  // ---------------- small talk ----------------
  // Greetings, thanks, and "who are you" are not product questions — routing them through
  // Section 6/7 (retrieve -> validate -> cite-or-refuse) just produces the cold "I don't know
  // which product area this is about" reply for messages that were never asking about a product
  // area in the first place. Caught here, before retrieval, so a plain "hi" gets a plain reply.
  var GREETING_RE = /^(hi|hello|hey|hiya|yo|howdy|good\s?(morning|afternoon|evening))[\s,!.]*(there|nexis|team)?[\s,!.]*$/;
  var THANKS_RE = /^(thanks|thank\s?you|thankyou|thx|ty|much appreciated|appreciate it|cheers)[\s,!.]*(so much|a lot|very much|nexis)?[\s,!.]*$/;
  var BYE_RE = /^(bye|goodbye|see you( (later|soon|around|then))?|see ya|later|take care|that('?s| is) all|that('?s| is) it|all good( now)?)[\s,!.]*$/;
  var HOWAREYOU_RE = /^how('?s| is| are)\s+(you|it going|things)\b/;
  var WHOAMI_RE = /^(who|what)\s+are\s+you\b|^what\s+can\s+you\s+do\b|^what\s+is\s+nexis\b/;
  var GREETING_REPLIES = [
    "Hi! What can I help you with today — anything about Modern Requirements4DevOps or Copilot4DevOps?",
    "Hello! Happy to help — what's going on?",
    "Hey there! What would you like a hand with?"
  ];
  function smallTalkReply(rawText){
    var t = String(rawText || '').trim().toLowerCase().replace(/[!?.]+$/, '');
    if(!t) return null;
    if(WHOAMI_RE.test(t)) return "I'm Nexis, the product assistant for Modern Requirements4DevOps and Copilot4DevOps. I answer from the " + KB.length + " indexed sections of documentation loaded here, and I'll tell you plainly if something isn't covered rather than guess. What can I help with?";
    if(HOWAREYOU_RE.test(t)) return "Doing well, thanks for asking! What can I help you with today?";
    if(THANKS_RE.test(t)) return "You're welcome! Let me know if anything else comes up.";
    if(BYE_RE.test(t)) return "Take care — I'm here whenever you need me again.";
    if(GREETING_RE.test(t)) return GREETING_REPLIES[Math.floor(Math.random() * GREETING_REPLIES.length)];
    return null;
  }

  function detectVersion(normalized){
    var m = normalized.match(/\b(20\d\d)\b/) || normalized.match(/\bpatch\s*(\d+)\b/) || normalized.match(/\bv(\d+(?:\.\d+)?)\b/);
    return m ? m[0] : 'unconfirmed';
  }
  function detectEnvironment(normalized){
    if(/embedded/.test(normalized)) return 'Embedded (Azure DevOps)';
    if(/standalone/.test(normalized)) return 'Standalone';
    if(/on.?prem|server|tfs/.test(normalized)) return 'On-premises Azure DevOps Server';
    if(/cloud|dev\.azure\.com|azure devops services/.test(normalized)) return 'Cloud Azure DevOps';
    return 'unconfirmed';
  }
  function detectProduct(entities, matches){
    var products = {};
    entities.forEach(function(e){ products[e.product] = true; });
    if(!entities.length && matches.length){
      products[/Copilot/i.test(matches[0].entry.sourceDoc + matches[0].entry.title) ? 'Copilot4DevOps' : 'MR4DevOps'] = true;
    }
    var keys = Object.keys(products);
    if(!keys.length) return 'unconfirmed';
    return keys.join(' + ');
  }
  function confidenceBand(conf){
    if(conf >= DIRECT_ANSWER_THRESHOLD) return 'high';
    if(conf >= 0.32) return 'medium';
    return 'low';
  }

  // SECTION 8 — attachments are evidence, weighted like retrieved documentation.
  // Honest limitation: this build has no OCR/vision, so image contents cannot be read
  // automatically. Attachments are recorded and flagged for human review rather than
  // having their contents invented.
  function describeAttachments(parts){
    var atts = (parts || []).filter(function(p){ return p.type === 'image' || p.type === 'file'; });
    if(!atts.length) return { count: 0, names: [], note: 'None provided.' };
    var names = atts.map(function(a){ return a.name || (a.type === 'image' ? 'screenshot' : 'file'); });
    return {
      count: atts.length,
      names: names,
      note: atts.length + ' attachment(s) provided (' + names.join(', ') + '). Contents are not machine-readable in this build — an agent must open them to read error text, version strings and visible configuration.'
    };
  }

  // SECTION 4 — ambiguity detection. Two distinct named entities, or two near-tied matches
  // from different areas with nothing named, means we must ask rather than pick.
  function detectAmbiguity(entities, matches){
    if(entities.length >= 2){
      return { ambiguous: true, what: 'the message names more than one distinct feature', options: entities.slice(0, 3).map(function(e){ return e.name; }) };
    }
    if(!entities.length && matches.length >= 2){
      var a = matches[0], b = matches[1];
      // Both candidates need a real keyword/phrase hit of their own, not just weak stemmed
      // token overlap — otherwise two coincidentally-close near-zero scores (e.g. a message with
      // no real topic in it at all) get presented as a genuine two-way choice between unrelated
      // documents, which reads as nonsense rather than an honest "I don't know."
      if(a.keywordScore > 0 && b.keywordScore > 0 && a.entry.sourceDoc !== b.entry.sourceDoc && Math.abs(a.score - b.score) < 0.4){
        return { ambiguous: true, what: 'the wording fits two different areas equally well', options: [friendlyTopicName(a.entry.sourceDoc), friendlyTopicName(b.entry.sourceDoc)] };
      }
    }
    return { ambiguous: false, what: null, options: [] };
  }

  // ---------------- structured response pipeline ----------------
  // Question -> Understand -> Check latest knowledge -> Analyze -> Verify -> Answer -> Suggest further investigation
  var DIRECT_ANSWER_THRESHOLD = 0.55;

  // Verify: does the top match actually look like a direct answer, or just a topically-related section?
  function needsFurtherInvestigation(text, matches, confidence){
    if(!matches.length) return true;
    var lower = text.toLowerCase();
    if(ESCALATION_WORDS.some(function(w){ return lower.indexOf(w) !== -1; })) return true;
    if(confidence < DIRECT_ANSWER_THRESHOLD) return true;
    return false;
  }

  // Suggest a concrete next action: review logs, check configuration, reproduce, request info, or escalate.
  function suggestNextAction(text, matches, confidence){
    var lower = text.toLowerCase();
    if(ESCALATION_WORDS.some(function(w){ return lower.indexOf(w) !== -1; })){
      return "This mentions a possible data-integrity or production-impact issue — escalate to L2/L3 · R&D rather than answering from documentation alone.";
    }
    if(!matches.length){
      return "Nothing in the current documentation matches this closely enough to trust. Ask the customer for more detail (exact product/module, error text, and a screenshot or log if available), then check with the team whether this is a known issue before replying.";
    }
    if(confidence < 0.32){
      return "The best match found is only loosely related — confirm the customer's exact scenario (version, Embedded vs Standalone, steps to reproduce) and verify against the cited source page before sending a reply.";
    }
    if(/error|fail|exception|crash|freeze|hang/.test(lower) && lower.indexOf('log') === -1 && lower.indexOf('screenshot') === -1){
      return "Request the exact error text or a log file/screenshot, then compare it against the cited documentation to confirm this is the same issue before sending a fix.";
    }
    if(/config|setting|permission|admin panel|install/.test(lower)){
      return "Ask the customer to confirm their current configuration/settings against the steps in the cited source — a mismatch there is the most common cause — and reproduce the scenario if possible.";
    }
    return "The closest documentation only partially covers this question — verify the specific detail the customer asked about against the cited source page, and reproduce the scenario if possible, before sending a final answer.";
  }

  // Compose the final structured reply. This is the "extract the topic -> only use directly
  // relevant information -> verify -> answer" pipeline the customer actually asked for:
  //  1. A candidate only counts if it has its own real keyword/topic signal (hasOwnTopicSignal) —
  //     this is the "extract the key product/feature/topic" + "do not combine unrelated docs
  //     because of similar keywords" step.
  //  2. A topic-less follow-up ("how do we achieve it") is answered by staying anchored to the
  //     topic already under discussion (lastSourceDoc), never by letting some other, unrelated
  //     document win on a coincidental score.
  //  3. If nothing genuinely relevant is found — even within the current topic — the reply says so
  //     plainly instead of guessing, which is the final Question vs. Answer validation.
  function friendlyTopicName(sourceDoc){
    return String(sourceDoc || '').replace(/\s+(Technote|Guide)$/i, '');
  }
  // "About" = the document's own title or source names the feature, as opposed to merely
  // listing it among its keywords.
  function isAboutEntity(entry, matchPhrase){
    return (entry.sourceDoc + ' ' + entry.title).toLowerCase().indexOf(matchPhrase) !== -1;
  }
  // Customers think in features ("Smart Docs"), not in source documents ("NextGen Online Help").
  // Anything shown to a customer must be named as a feature wherever one can be identified.
  function entityNameForEntry(entry){
    if(!entry) return null;
    var hay = (entry.sourceDoc + ' ' + entry.title + ' ' + entry.keywords.join(' ')).toLowerCase();
    for(var i = 0; i < ENTITIES.length; i++){
      for(var j = 0; j < ENTITIES[i].match.length; j++){
        if(hay.indexOf(ENTITIES[i].match[j]) !== -1) return ENTITIES[i].name;
      }
    }
    var friendly = friendlyTopicName(entry.sourceDoc);
    return /online help|release notes/i.test(friendly) ? null : friendly;
  }
  // SECTION 7 — response validation. Run against every draft before it is allowed out.
  // A failing draft is discarded and regenerated as an honest "not enough verified
  // information" reply — never patched into something that merely looks right.
  function validateDraft(draft, reasoning){
    var problems = [];
    if(!draft.usedMatches.length){
      problems.push('No retrieved source supports an answer.');
      return { pass: false, problems: problems };
    }
    var top = draft.usedMatches[0];
    // The answer must be about the feature the customer actually named (Section 7: never
    // answer an adjacent topic that happened to surface in retrieval). When several features
    // were named, the one committed to after clarification is the one that must match.
    var committed = reasoning.committedEntity || (reasoning.entities.length === 1 ? reasoning.entities[0] : null);
    // A document whose own title/source says it's about the entity the customer named is
    // strong-enough evidence on its own — a typo or unusual phrasing ("tell me abaout MR")
    // can knock out every literal keyword-phrase match without the topic itself being any
    // less certain, and this shouldn't force a false "not confident" reply in that case.
    // ...but only for a genuine "what is / tell me about" style ask — a described problem
    // ("my license is NOT WORKING") must still clear the real keyword bar, since a document
    // merely being *about* the named topic (e.g. how to reach the activation page) doesn't
    // mean it answers what's actually wrong. This is exactly the case the strict check exists
    // to catch, so it stays strict whenever the message reads like a complaint, not an ask.
    var isOverviewIntent = reasoning.intent === 'how-it-works' || reasoning.intent === 'general-info';
    var describesAProblem = HIGH_PRIORITY_WORDS.concat(MED_PRIORITY_WORDS).some(function(w){ return reasoning.restated.indexOf(w) !== -1; });
    var topIsAboutCommitted = committed && isOverviewIntent && !describesAProblem && isAboutEntity(top.entry, committed.match);
    if(top.keywordScore === 0 && !draft.anchoredToContext && !topIsAboutCommitted){
      problems.push('Top source has no direct topical overlap with the question wording.');
    }
    if(committed){
      var haystack = (top.entry.sourceDoc + ' ' + top.entry.title + ' ' + top.entry.keywords.join(' ')).toLowerCase();
      if(haystack.indexOf(committed.match) === -1){
        problems.push('Customer named "' + committed.name + '" but the best source is about "' + friendlyTopicName(top.entry.sourceDoc) + '".');
      }
    }
    if(reasoning.confidenceBand === 'low'){
      problems.push('Confidence is low — not presentable as settled.');
    }
    return { pass: problems.length === 0, problems: problems };
  }

  // Customer-facing "what to do right now", tuned to intent. Plain English, no internal terms.
  function nextStepFor(intent, entityName, settled){
    var what = entityName ? entityName : 'this feature';
    if(!settled) return null; // unsettled replies build their own ask
    switch(intent){
      case 'config':
        return 'Try the steps above in your own project. If a setting on your screen does not match what is described, tell me what you see and I will take it from there.';
      case 'error':
        return 'Work through the steps above. If the same error comes back, send me the exact error text or a screenshot and I will check it against the known issues.';
      case 'licensing':
        return 'Check this against your current licence details. If what you see does not line up, tell me and I will pick it up with the licensing team.';
      case 'limitation':
      case 'compatibility':
        return 'Plan around this limit for now. If you need it raised or changed, say so and I will raise it as a product request.';
      case 'version-diff':
        return 'Confirm which version you are on so I can tell you whether this applies to your environment.';
      case 'comparison':
        return 'Let me know which of the two you want to go with and I can walk you through it.';
      default:
        return 'Nothing further is needed from you. If you want, I can go deeper into any part of ' + what + '.';
    }
  }

  // SECTION 6 — customer-facing response generation.
  // Returns Understanding / Answer / Next Step / Further Investigation Required, plus the
  // Section 3 reasoning block, which stays internal (agent console only).
  function composeNexisReply(text, rawMatches, ctx){
    ctx = ctx || {};
    var normalized = normalizeQuery(text);
    var entities = detectEntities(normalized);
    var intent = classifyIntent(normalized);
    var attachments = ctx.attachments || { count: 0, names: [], note: 'None provided.' };
    var rounds = ctx.clarificationRounds || 0;

    var usedMatches = rawMatches;
    var anchoredToContext = false;
    var assumption = null;
    var validatedTopic = hasOwnTopicSignal(rawMatches);

    // Topic-less follow-up ("how do we achieve it") continues the investigation already in
    // progress rather than restarting from zero (Section 4).
    if(!validatedTopic && ctx.lastSourceDoc){
      var contextMatches = findMatchesWithinDoc(text, ctx.lastSourceDoc);
      if(contextMatches.length){
        usedMatches = contextMatches;
        validatedTopic = true;
        anchoredToContext = true;
        assumption = 'still about ' + (ctx.lastTopicLabel || friendlyTopicName(ctx.lastSourceDoc));
      } else {
        usedMatches = [];
      }
    }

    var ambiguity = detectAmbiguity(entities, rawMatches);

    // Section 4: once two clarification rounds are spent, stop asking and commit to the
    // best-supported reading. Committing means retrieval is restricted to that one feature —
    // leaving it free to return whatever scored highest across all the named features is how a
    // reply ends up claiming to be about Smart Docs while quoting something else entirely.
    var committedEntity = null;
    if(ambiguity.ambiguous && rounds >= 2 && entities.length){
      committedEntity = entities[0];
      usedMatches = usedMatches
        .filter(function(m){
          var hay = (m.entry.sourceDoc + ' ' + m.entry.title + ' ' + m.entry.keywords.join(' ')).toLowerCase();
          return hay.indexOf(committedEntity.match) !== -1;
        })
        // A document that is *about* the feature (its title/source says so) beats one that merely
        // mentions it in passing among its keywords — otherwise a release-note bug list wins over
        // the actual feature documentation just by listing more matching keywords.
        .sort(function(a, b){
          var aAbout = isAboutEntity(a.entry, committedEntity.match) ? 0 : 1;
          var bAbout = isAboutEntity(b.entry, committedEntity.match) ? 0 : 1;
          if(aAbout !== bAbout) return aAbout - bAbout;
          return rankMatches(a, b);
        });
      assumption = 'a question about ' + committedEntity.name;
      if(!usedMatches.length) validatedTopic = false;
    } else if(!ambiguity.ambiguous && entities.length === 1){
      // A single, clearly named feature or product isn't ambiguous at all — a common term the
      // customer named outright. Scope straight to it and answer, the same way a forced commit
      // does after two failed clarification rounds, instead of first requiring the raw free-text
      // search to separately clear the generic keyword bar. No "I'm assuming..." hedge here —
      // unlike a forced commit, the customer's own wording already said exactly which one they
      // meant, so there's nothing to hedge about. Only takes effect if this actually finds
      // something for that entity; otherwise falls through unchanged, no regression risk.
      // Searches the whole KB, not just rawMatches — a query that's otherwise noisy (a typo, an
      // odd phrasing) can score below findMatches' own threshold and never reach rawMatches at
      // all, even though the entity itself was identified with certainty from the same text.
      var entityQueryStems = expandQueryStems(normalized);
      var scoped = KB
        .filter(function(e){
          var hay = (e.sourceDoc + ' ' + e.title + ' ' + e.keywords.join(' ')).toLowerCase();
          return hay.indexOf(entities[0].match) !== -1;
        })
        .map(function(e){
          var s = scoreEntry(e, normalized, entityQueryStems);
          return { entry: e, score: s.total, keywordScore: s.keywordScore, tokenScore: s.tokenScore };
        })
        .sort(function(a, b){
          var aAbout = isAboutEntity(a.entry, entities[0].match) ? 0 : 1;
          var bAbout = isAboutEntity(b.entry, entities[0].match) ? 0 : 1;
          if(aAbout !== bAbout) return aAbout - bAbout;
          return rankMatches(a, b);
        });
      if(scoped.length){
        committedEntity = entities[0];
        usedMatches = scoped;
        validatedTopic = true;
      }
    }

    var topEntry = usedMatches.length ? usedMatches[0].entry : null;
    var confidence = usedMatches.length ? Math.min(0.97, 0.42 + usedMatches[0].score * 0.07) : 0;

    var reasoning = {
      committedEntity: committedEntity,
      product: detectProduct(entities, usedMatches),
      module: topEntry ? (entityNameForEntry(topEntry) || friendlyTopicName(topEntry.sourceDoc)) : 'unconfirmed',
      sourceDocName: topEntry ? topEntry.sourceDoc : 'unconfirmed',
      feature: topEntry ? topEntry.title : 'unconfirmed',
      version: detectVersion(normalized),
      environment: detectEnvironment(normalized),
      intent: intent,
      restated: excerpt(normalized, 160),
      entities: entities,
      entityNames: entities.map(function(e){ return e.name; }),
      conversationContext: ctx.lastSourceDoc ? ('prior turns about ' + friendlyTopicName(ctx.lastSourceDoc)) : 'first turn on this ticket',
      ambiguous: ambiguity.ambiguous,
      ambiguityWhat: ambiguity.what,
      clarificationRounds: rounds,
      sourceIds: usedMatches.slice(0, 5).map(function(m){ return m.entry.id; }),
      sourceTier: topEntry ? sourceTierLabel(topEntry.sourceDoc) : 'n/a',
      confidence: confidence,
      confidenceBand: confidenceBand(confidence),
      attachments: attachments,
      anchoredToContext: anchoredToContext,
      assumption: assumption,
      possibleCause: null,
      requiredInvestigation: null,
      validationProblems: []
    };

    var named = committedEntity ? committedEntity.name
      : (entities.length === 1 ? entities[0].name : (topEntry ? entityNameForEntry(topEntry) : null));
    // Narrower than `named`: only a feature the customer's own wording actually identified
    // (never the accidental top scorer of an unvalidated search) — safe to state as fact in
    // the "nothing usable retrieved" branch below, where topEntry is noise by definition.
    var confidentlyNamed = committedEntity ? committedEntity.name : (entities.length === 1 ? entities[0].name : null);

    function unsettled(understanding, answer, nextStep, missingWhat, cause){
      reasoning.possibleCause = cause || null;
      reasoning.requiredInvestigation = missingWhat;
      return {
        understanding: understanding, answer: answer, nextStep: nextStep,
        investigate: true, missingWhat: missingWhat, citation: null,
        resolvedSourceDoc: ctx.lastSourceDoc || null, usedMatches: [], reasoning: reasoning,
        anchoredToContext: anchoredToContext
      };
    }

    // --- Ambiguity: ask one short, easy question, at most twice (Section 4) -------------
    if(ambiguity.ambiguous && rounds < 2){
      var opts = ambiguity.options.map(function(o, i){ return '(' + String.fromCharCode(97 + i) + ') ' + o; }).join(', ');
      return {
        understanding: "That could apply to more than one part of the product.",
        answer: "I'd rather confirm which one than guess and risk answering the wrong part.",
        nextStep: 'Which one do you mean: ' + opts + ', or something else?',
        investigate: true,
        missingWhat: 'which feature the question is about',
        citation: null,
        resolvedSourceDoc: ctx.lastSourceDoc || null,
        usedMatches: [],
        reasoning: reasoning,
        askedClarification: true,
        anchoredToContext: anchoredToContext
      };
    }

    // --- Nothing usable retrieved (Section 10 failure behaviour) ------------------------
    if(!validatedTopic || !usedMatches.length){
      if(ctx.lastSourceDoc){
        return unsettled(
          "Following up on " + (ctx.lastTopicLabel || 'what we were just discussing') + " — I'm just not sure yet exactly which part you mean.",
          "I don't have documentation that covers \"" + excerpt(text, 70) + "\" specifically, and I'd rather ask than guess.",
          'Could you tell me in one line what you’re trying to do with ' + (ctx.lastTopicLabel || 'it') + '?',
          'a clearer description of what you are trying to do',
          'POSSIBLE: the question may relate to a part of this feature that is not documented in the loaded material.'
        );
      }
      return unsettled(
        attachments.count && !text
          ? "Thanks for sending that over."
          : confidentlyNamed
            ? ("This looks like it's about " + confidentlyNamed + ".")
            : "I can see you have a question, but I'm not yet sure which part of the product it's about.",
        "I don't have a confident, verified answer for this in the documentation, and I'd rather ask than guess.",
        confidentlyNamed
          ? ('Could you tell me more about what’s happening with ' + confidentlyNamed + ' — the exact error or behaviour you’re seeing, and whether it’s Embedded or Standalone?')
          : 'Which product and feature is this about — for example Modern Requirements4DevOps (Smart Docs, Baseline, Review, Trace Analysis) or Copilot4DevOps?',
        'the product and feature involved',
        null
      );
    }

    // --- Draft the answer, then validate it before it is allowed out (Section 7) --------
    var draft = { usedMatches: usedMatches, anchoredToContext: anchoredToContext };
    var verdict = validateDraft(draft, reasoning);
    reasoning.validationProblems = verdict.problems;

    if(!verdict.pass){
      reasoning.possibleCause = 'POSSIBLE: closest material found was "' + topEntry.title + '" (' + topEntry.sourceDoc + '), which did not survive validation.';
      return unsettled(
        named ? ('You’re asking about ' + named + '.') : ('You’re asking about "' + excerpt(text, 70) + '".'),
        "I couldn't confirm an answer to this from the current documentation. The closest material I found doesn't actually answer what you asked, so I won't present it as if it did.",
        intent === 'error'
          ? "Could you send the exact error message or a screenshot, and let me know whether you're on Azure DevOps cloud or an on-premises server?"
          : "Could you tell me a bit more about the exact feature and what you're trying to do? I'll check it properly.",
        'verified documentation covering this exact question',
        reasoning.possibleCause
      );
    }

    // --- Settled answer ----------------------------------------------------------------
    var understanding = named
      ? ('You are asking about ' + named + (intent === 'how-it-works' ? ' and how it works.' : '.'))
      : ('You are asking about "' + excerpt(text, 70) + '".');
    if(assumption) understanding += ' I am assuming this is ' + assumption + ' — tell me if you meant something else.';
    if(attachments.count) understanding += ' I can see you attached ' + attachments.names.join(', ') + '; an agent will need to open it, as I cannot read image contents directly.';

    reasoning.requiredInvestigation = null;
    return {
      understanding: understanding,
      answer: topEntry.answer,
      nextStep: nextStepFor(intent, named, true),
      investigate: false,
      missingWhat: null,
      citation: 'Source: ' + topEntry.sourceDoc + ', "' + topEntry.title + '" — page ' + topEntry.page,
      resolvedSourceDoc: topEntry.sourceDoc,
      resolvedTopicLabel: entityNameForEntry(topEntry) || friendlyTopicName(topEntry.sourceDoc),
      usedMatches: usedMatches,
      reasoning: reasoning,
      anchoredToContext: anchoredToContext
    };
  }

  // ============================================================
  //  TICKET STORE (persisted via the local API)
  // ============================================================
  var tickets = [];
  var activeTicketId = null;
  var learningLog = [];
  var queueFilter = { query:'', status:'all', priority:'all' };
  var kbFilter = { query:'' };

  function nowLabel(){
    var d = new Date();
    return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  }

  function makeTicket(opts){
    var t = {
      subject: opts.subject, customer: opts.customer || "You", status: opts.status || "New",
      priority: opts.priority || "Medium", messages: opts.messages || [], matches: opts.matches || [],
      matchIds: (opts.matches||[]).map(function(m){ return m.entry.id; }),
      confidence: opts.confidence || 0, module: opts.module || "Unclassified",
      escalate: !!opts.escalate, escalateReason: opts.escalateReason || null,
      investigate: opts.investigate !== undefined ? !!opts.investigate : true, nextAction: opts.nextAction || null,
      reasoning: opts.reasoning || null, clarificationRounds: 0, lastSourceDoc: null,
      draft: opts.draft || "", draftIsHtml:false, followups: opts.followups || [],
      responseAttachments: [], createdAt: opts.createdAt || nowLabel(), isLive: !!opts.isLive,
      id: 'local-' + Date.now() + '-' + Math.random().toString(36).slice(2,7)
    };
    tickets.push(t);
    apiPost('/api/tickets', {
      subject:t.subject, customer:t.customer, status:t.status, priority:t.priority,
      module:t.module, confidence:t.confidence, escalate:t.escalate, escalateReason:t.escalateReason,
      draft:t.draft, followups:t.followups, createdAt:t.createdAt, matchIds:t.matchIds
    }).then(function(saved){
      t.id = saved.id; // bug fix: keep the customer-facing ticket-id label in sync once the real server id arrives
      renderQueue();
      if(t.id === activeTicketId || t.isLive) syncLiveTicketIdLabel(t);
    }).catch(function(){ toast('Could not save the new ticket to the server — it will only exist for this session.', 'warning'); });
    return t;
  }

  // The recommended next diagnostic step is either a full sentence already (from the
  // investigation advisor) or a noun phrase describing what is still missing.
  function nextDiagnosticStep(t){
    var a = t.nextAction;
    if(!a) return 'Reproduce in a controlled environment and confirm against current official documentation.';
    if(/[.!?]\s*$/.test(a) || a.length > 90) return a;
    return 'Obtain ' + a + ', then reproduce against the cited source.';
  }

  // SECTION 9 — structured escalation handoff. This is the deliverable of a failed
  // resolution, so it must be complete enough that L2/L3 never has to re-ask the customer.
  function buildEscalationTicket(t){
    var r = t.reasoning || {};
    var firstUser = null;
    for(var i = 0; i < t.messages.length; i++){
      if(t.messages[i].role === 'user'){ firstUser = t.messages[i]; break; }
    }
    var verbatim = firstUser ? firstUser.parts.map(function(p){ return p.type === 'text' ? p.value : ''; }).join('').trim() : t.subject;
    var atts = r.attachments && r.attachments.count
      ? r.attachments.note
      : 'None provided.';
    var docsChecked = (t.matches || []).slice(0, 5).map(function(m){
      return '    - ' + m.entry.id + ' (' + m.entry.sourceDoc + ', p.' + m.entry.page + '): ' + m.entry.title;
    }).join('\n') || '    - None matched closely enough to cite.';
    var whyNotResolved;
    if(r.validationProblems && r.validationProblems.length){
      whyNotResolved = r.validationProblems.join(' ');
    } else if(!(t.matches && t.matches.length)){
      whyNotResolved = 'No documentation covers this question.';
    } else if(/data loss|corrupt|security|breach|outage|production down/i.test(verbatim)){
      whyNotResolved = 'Documentation describes the feature, but the reported symptom indicates possible data/production impact that documentation cannot confirm or rule out — needs specialist verification.';
    } else {
      whyNotResolved = 'Closest sources were topically related but did not answer the exact question asked.';
    }
    var urgency = /urgent|asap|critical|production|down|blocker/i.test(verbatim) ? 'Customer signalled urgency in their own words.' : 'None signalled by the customer.';
    var suspected = r.possibleCause || (t.escalateReason ? ('POSSIBLE: ' + t.escalateReason) : 'POSSIBLE: not determined from available documentation.');

    return [
      'ESCALATION TICKET',
      'Customer-reported issue (verbatim, normalized):',
      '    "' + excerpt(verbatim, 400) + '"',
      'Product / Module / Feature:',
      '    ' + (r.product || 'unconfirmed') + ' / ' + (r.module || t.module || 'unconfirmed') + ' / ' + (r.feature || 'unconfirmed'),
      'Version / Environment:',
      '    ' + (r.version && r.version !== 'unconfirmed' ? r.version : 'unconfirmed — ask customer') +
        ' / ' + (r.environment && r.environment !== 'unconfirmed' ? r.environment : 'unconfirmed — ask customer'),
      'Symptom vs. suspected cause (explicitly separated):',
      '    SYMPTOM (customer-observed): ' + excerpt(verbatim, 200),
      '    ' + suspected,
      'Steps already tried / ruled out:',
      '    ' + (t.clarificationRounds ? (t.clarificationRounds + ' clarification round(s) with the customer.') : 'None recorded in this channel.'),
      'Relevant documentation checked (with source IDs) and why it did not resolve this:',
      docsChecked,
      '    Why unresolved: ' + whyNotResolved,
      'Attachments/logs provided:',
      '    ' + atts,
      'Recommended next diagnostic step:',
      '    ' + nextDiagnosticStep(t),
      'Urgency signal (if customer indicated one):',
      '    ' + urgency
    ].join('\n');
  }

  // SECTION 3 rendering — agent console only. Never shown to the customer.
  function renderReasoningPanel(t){
    var r = t.reasoning;
    if(!r) return '<div class="empty-inline">No reasoning recorded for this ticket.</div>';
    var rows = [
      ['Product', r.product],
      ['Module', r.module],
      ['Source document', r.sourceDocName || '—'],
      ['Feature', r.feature],
      ['Version', r.version],
      ['Environment', r.environment],
      ['Customer intent', r.intent],
      ['Question (restated)', r.restated],
      ['Distinct entities named', r.entityNames && r.entityNames.length ? r.entityNames.join(', ') : 'none identified'],
      ['Conversation context', r.conversationContext],
      ['Ambiguity', r.ambiguous ? ('YES — ' + r.ambiguityWhat) : 'NO'],
      ['Clarification rounds used', String(t.clarificationRounds || 0) + ' of 2'],
      ['Knowledge retrieved', r.sourceIds && r.sourceIds.length ? r.sourceIds.join(', ') : 'none'],
      ['Source hierarchy applied', r.sourceTier],
      ['Confidence', r.confidenceBand + ' (' + Math.round((r.confidence || 0) * 100) + '%)'],
      ['Potential cause', r.possibleCause || '—'],
      ['Required investigation', r.requiredInvestigation || 'none'],
      ['Attachments', r.attachments ? r.attachments.note : 'None provided.']
    ];
    if(r.validationProblems && r.validationProblems.length){
      rows.push(['Validation blocked answer', r.validationProblems.join(' | ')]);
    }
    if(r.assumption) rows.push(['Assumption stated to customer', r.assumption]);
    return '<div class="analysis-grid">' + rows.map(function(row){
      return '<div class="a-field" style="grid-column:1/-1;"><span class="lbl">' + escapeHtml(row[0]) + '</span><span class="val">' + escapeHtml(String(row[1] == null ? '—' : row[1])) + '</span></div>';
    }).join('') + '</div>';
  }

  function persistTicketUpdate(t, extra){
    if(!t.id) return;
    var body = Object.assign({ status:t.status, priority:t.priority, escalate:t.escalate, escalateReason:t.escalateReason }, extra || {});
    apiPatch('/api/tickets/' + encodeURIComponent(t.id), body).catch(function(){
      toast('Could not save this change to the server.', 'warning');
    });
  }

  function log(entryHtml){
    learningLog.unshift({ text: entryHtml, ts: nowLabel() });
    if(notifPanel.hasAttribute('hidden')) notifDot.hidden = false;
    renderNotifPanel();
    if(currentView === 'kb') renderLearningLog();
    apiPost('/api/log', { text: entryHtml });
  }
